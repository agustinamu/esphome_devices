# Sensores de una ranura del NC2200. Se incluye 4 veces desde package.yaml
# con vars: n (índice del protocolo, 0-3) y slot (número en el cargador, 1-4).

sensor:
  - platform: template
    id: v${n}
    name: "Ranura ${slot} voltaje"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
  - platform: template
    id: i${n}
    name: "Ranura ${slot} corriente"
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
  - platform: template
    id: c${n}
    name: "Ranura ${slot} capacidad"
    unit_of_measurement: mAh
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: t${n}
    name: "Ranura ${slot} temperatura"
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: r${n}
    name: "Ranura ${slot} resistencia"
    unit_of_measurement: mΩ
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: s${n}
    name: "Ranura ${slot} tiempo"
    unit_of_measurement: s
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

text_sensor:
  - platform: template
    id: st${n}
    name: "Ranura ${slot} estado"
    update_interval: never

# Programa de la ranura. Se lee del cargador con 0x93 y se escribe con 0x94 al
# cambiarlo desde HA. Ojo: 0x94 reinicia la ranura con el programa nuevo, así que
# solo se manda si el cambio afecta al modo elegido (un cambio de modo, o la
# corriente o capacidad que ese modo usa). No hay "parar" ni "reiniciar" a secas.
# Rangos: los de la app SkyRC.
select:
  - platform: template
    id: m${n}
    name: "Ranura ${slot} programa"
    icon: mdi:battery-sync
    options: ["carga", "descarga", "refresh", "break-in"]
    optimistic: true
    set_action:
      - lambda: |-
          auto old = id(m${n}).active_index();
          auto idx = id(m${n}).index_of(x);
          if (!idx.has_value() || old == idx) return;
          id(prog${n}).execute(*idx + 1, id(cc${n}).state, id(cd${n}).state, id(cap${n}).state);

number:
  - platform: template
    id: cc${n}
    name: "Ranura ${slot} corriente de carga"
    icon: mdi:battery-arrow-up
    unit_of_measurement: mA
    min_value: 200
    max_value: 2000
    step: 100
    mode: box
    optimistic: true
    set_action:
      - lambda: |-
          uint8_t mode = id(m${n}).active_index().value_or(9) + 1;
          if (x == id(cc${n}).state || !(mode == 1 || mode == 3)) return;
          id(prog${n}).execute(mode, x, id(cd${n}).state, id(cap${n}).state);
  - platform: template
    id: cd${n}
    name: "Ranura ${slot} corriente de descarga"
    icon: mdi:battery-arrow-down
    unit_of_measurement: mA
    min_value: 100
    max_value: 1000
    step: 100
    mode: box
    optimistic: true
    set_action:
      - lambda: |-
          uint8_t mode = id(m${n}).active_index().value_or(9) + 1;
          if (x == id(cd${n}).state || !(mode == 2 || mode == 3)) return;
          id(prog${n}).execute(mode, id(cc${n}).state, x, id(cap${n}).state);
  - platform: template
    id: cap${n}
    name: "Ranura ${slot} capacidad break-in"
    icon: mdi:battery-high
    unit_of_measurement: mAh
    min_value: 500
    max_value: 3200
    step: 100
    mode: box
    optimistic: true
    set_action:
      - lambda: |-
          uint8_t mode = id(m${n}).active_index().value_or(9) + 1;
          if (x == id(cap${n}).state || mode != 4) return;
          id(prog${n}).execute(mode, id(cc${n}).state, id(cd${n}).state, x);

script:
  - id: prog${n}
    mode: queued
    parameters:
      mode: int
      cc: float
      cd: float
      cap: float
    then:
      - uart.write:
          id: nc
          data: !lambda |-
            bool need_cc = mode == 1 || mode == 3, need_cd = mode == 2 || mode == 3;
            if ((need_cc && isnan(cc)) || (need_cd && isnan(cd)) || (mode == 4 && isnan(cap))) {
              ESP_LOGW("nc2200", "Ranura ${slot}: falta un valor del programa, no se manda");
              return std::vector<uint8_t>{};
            }
            // Como la app: a 0 lo que el modo no usa.
            uint16_t c = need_cc ? cc : 0, d = need_cd ? cd : 0, k = mode == 4 ? cap : 0;
            std::vector<uint8_t> f{0x0F, 0x13, 0x94, ${n}, (uint8_t) mode,
                                   (uint8_t) (c >> 8), (uint8_t) c,
                                   (uint8_t) (d >> 8), (uint8_t) d,
                                   (uint8_t) (k >> 8), (uint8_t) k};
            f.resize(3 + 17, 0);
            uint8_t sum = 0;
            for (size_t j = 2; j < f.size(); j++) sum += f[j];
            f.push_back(sum);
            ESP_LOGI("nc2200", "Programa ranura ${slot}: modo %d, carga %u mA, descarga %u mA, %u mAh",
                     mode, c, d, k);
            id(prog_req) |= 1 << ${n};
            return f;
