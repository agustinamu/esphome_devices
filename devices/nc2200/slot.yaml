# Sensores de una ranura del NC2200. Se incluye 4 veces desde package.yaml
# con vars: n (índice del protocolo, 0-3) y slot (número en el cargador, 1-4).

sensor:
  - platform: template
    id: v${n}
    name: "Ranura ${slot} voltaje"
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
  - platform: template
    id: i${n}
    name: "Ranura ${slot} corriente"
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
  - platform: template
    id: c${n}
    name: "Ranura ${slot} capacidad"
    unit_of_measurement: mAh
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: t${n}
    name: "Ranura ${slot} temperatura"
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: r${n}
    name: "Ranura ${slot} resistencia"
    unit_of_measurement: mΩ
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: s${n}
    name: "Ranura ${slot} tiempo"
    unit_of_measurement: s
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

text_sensor:
  - platform: template
    id: st${n}
    name: "Ranura ${slot} estado"
    update_interval: never

# Programa de la ranura (lo que hará al empezar). Se lee del cargador con 0x93
# y se escribe con 0x94 al pulsar "empezar". Rangos: los de la app SkyRC.
select:
  - platform: template
    id: m${n}
    name: "Ranura ${slot} programa"
    icon: mdi:battery-sync
    options: ["carga", "descarga", "refresh", "break-in"]
    optimistic: true

number:
  - platform: template
    id: cc${n}
    name: "Ranura ${slot} corriente de carga"
    icon: mdi:battery-arrow-up
    unit_of_measurement: mA
    min_value: 200
    max_value: 2000
    step: 100
    mode: box
    optimistic: true
  - platform: template
    id: cd${n}
    name: "Ranura ${slot} corriente de descarga"
    icon: mdi:battery-arrow-down
    unit_of_measurement: mA
    min_value: 100
    max_value: 1000
    step: 100
    mode: box
    optimistic: true
  - platform: template
    id: cap${n}
    name: "Ranura ${slot} capacidad break-in"
    icon: mdi:battery-high
    unit_of_measurement: mAh
    min_value: 500
    max_value: 3200
    step: 100
    mode: box
    optimistic: true

# Empezar: escribe el programa (0x94). El cargador reinicia la ranura con él,
# aunque esté en marcha. No hay comando de parar: la app tampoco lo tiene.
button:
  - platform: template
    name: "Ranura ${slot} empezar"
    icon: mdi:play
    on_press:
      - uart.write:
          id: nc
          data: !lambda |-
            auto idx = id(m${n}).active_index();
            float vcc = id(cc${n}).state, vcd = id(cd${n}).state, vcap = id(cap${n}).state;
            if (!idx.has_value()) {
              ESP_LOGW("nc2200", "Ranura ${slot}: programa aún sin leer del cargador");
              return std::vector<uint8_t>{};
            }
            uint8_t mode = *idx + 1;  // 1 carga, 2 descarga, 3 refresh, 4 break-in
            bool need_cc = mode == 1 || mode == 3, need_cd = mode == 2 || mode == 3;
            if ((need_cc && isnan(vcc)) || (need_cd && isnan(vcd)) || (mode == 4 && isnan(vcap))) {
              ESP_LOGW("nc2200", "Ranura ${slot}: falta un valor del programa");
              return std::vector<uint8_t>{};
            }
            uint16_t cc = need_cc ? vcc : 0;
            uint16_t cd = need_cd ? vcd : 0;
            uint16_t cap = mode == 4 ? vcap : 0;
            std::vector<uint8_t> f{0x0F, 0x13, 0x94, ${n}, mode,
                                   (uint8_t) (cc >> 8), (uint8_t) cc,
                                   (uint8_t) (cd >> 8), (uint8_t) cd,
                                   (uint8_t) (cap >> 8), (uint8_t) cap};
            f.resize(3 + 17, 0);
            uint8_t sum = 0;
            for (size_t k = 2; k < f.size(); k++) sum += f[k];
            f.push_back(sum);
            ESP_LOGI("nc2200", "Empezar ranura ${slot}: modo %u, carga %u mA, descarga %u mA, %u mAh",
                     mode, cc, cd, cap);
            id(prog_req) |= 1 << ${n};
            return f;
