# Guition JC8048W550 - ESP32-S3 con pantalla 5" 800x480
# Ejemplo: Reloj + Info WiFi + Botón táctil

esphome:
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Guition Fallback"
    password: !secret fallback_password

time:
  - platform: homeassistant
    id: ha_time

# Backlight PWM
output:
  - platform: ledc
    pin: GPIO1
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

# I2C para touch GT911
i2c:
  sda: GPIO19
  scl: GPIO20
  scan: false

touchscreen:
  - platform: gt911
    id: my_touch
    interrupt_pin: GPIO18

# Display RGB 800x480
display:
  - platform: rpi_dpi_rgb
    id: my_display
    color_order: RGB
    invert_colors: false
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 480
    de_pin: GPIO40
    hsync_pin: GPIO39
    vsync_pin: GPIO41
    pclk_pin: GPIO42
    pclk_frequency: 12MHz
    pclk_inverted: true
    hsync_front_porch: 40
    hsync_pulse_width: 48
    hsync_back_porch: 40
    vsync_front_porch: 13
    vsync_pulse_width: 3
    vsync_back_porch: 32
    data_pins:
      red:
        - GPIO45  # R3
        - GPIO48  # R4
        - GPIO47  # R5
        - GPIO21  # R6
        - GPIO14  # R7
      green:
        - GPIO5   # G2
        - GPIO6   # G3
        - GPIO7   # G4
        - GPIO15  # G5
        - GPIO16  # G6
        - GPIO4   # G7
      blue:
        - GPIO8   # B3
        - GPIO3   # B4
        - GPIO46  # B5
        - GPIO9   # B6
        - GPIO10  # B7

# LVGL UI
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  pages:
    - id: main_page
      widgets:
        # Reloj grande
        - label:
            align: TOP_MID
            y: 60
            text_font: montserrat_48
            text: "--:--"
            id: lbl_time
        # Fecha
        - label:
            align: TOP_MID
            y: 130
            text_font: montserrat_28
            text: "-- --- ----"
            id: lbl_date
        # Info WiFi
        - label:
            align: TOP_MID
            y: 200
            text_font: montserrat_18
            text: "WiFi: ---"
            id: lbl_wifi
        # Botón de prueba
        - button:
            align: CENTER
            y: 80
            width: 200
            height: 80
            widgets:
              - label:
                  align: CENTER
                  text: "TEST"
                  text_font: montserrat_28
            on_press:
              - logger.log: "Botón presionado!"
              - lvgl.widget.update:
                  id: lbl_status
                  text: "Pulsado!"
            on_release:
              - lvgl.widget.update:
                  id: lbl_status
                  text: ""
        # Status de botón
        - label:
            align: BOTTOM_MID
            y: -60
            text_font: montserrat_22
            text: ""
            id: lbl_status

# Actualizar hora cada segundo
interval:
  - interval: 1s
    then:
      - lvgl.widget.update:
          id: lbl_time
          text: !lambda |-
            static char buf[10];
            auto time = id(ha_time).now();
            snprintf(buf, sizeof(buf), "%02d:%02d", time.hour, time.minute);
            return buf;
      - lvgl.widget.update:
          id: lbl_date
          text: !lambda |-
            static char buf[20];
            static const char* months[] = {"Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"};
            auto time = id(ha_time).now();
            snprintf(buf, sizeof(buf), "%d %s %d", time.day_of_month, months[time.month-1], time.year);
            return buf;
  - interval: 10s
    then:
      - lvgl.widget.update:
          id: lbl_wifi
          text: !lambda |-
            static char buf[40];
            snprintf(buf, sizeof(buf), "WiFi: %s (%ddBm)", WiFi.SSID().c_str(), WiFi.RSSI());
            return buf;
