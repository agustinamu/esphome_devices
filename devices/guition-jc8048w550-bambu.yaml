# Guition JC8048W550 - Panel de control estilo Bambu Lab
# 800x480 - ESP32-S3
# Configurado para P1S con entidades en español

esphome:
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

globals:
  - id: last_touch_time
    type: unsigned long
    initial_value: '0'
  - id: screen_dimmed
    type: bool
    initial_value: 'false'

time:
  - platform: homeassistant
    id: ha_time

# Sensores de Home Assistant (Bambu Lab P1S - nombres en español)
sensor:
  - platform: homeassistant
    id: nozzle_temp
    entity_id: sensor.p1s_01p00c581002790_temperatura_de_la_boquilla
    on_value:
      - lvgl.label.update:
          id: lbl_nozzle
          text: !lambda |-
            static char buf[16];
            snprintf(buf, sizeof(buf), "%.0f°C", x);
            return buf;

  - platform: homeassistant
    id: nozzle_target
    entity_id: sensor.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
    on_value:
      - lvgl.label.update:
          id: lbl_nozzle_target
          text: !lambda |-
            static char buf[16];
            snprintf(buf, sizeof(buf), "/ %.0f°C", x);
            return buf;

  - platform: homeassistant
    id: bed_temp
    entity_id: sensor.p1s_01p00c581002790_temperatura_de_la_cama
    on_value:
      - lvgl.label.update:
          id: lbl_bed
          text: !lambda |-
            static char buf[16];
            snprintf(buf, sizeof(buf), "%.0f°C", x);
            return buf;

  - platform: homeassistant
    id: bed_target
    entity_id: sensor.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
    on_value:
      - lvgl.label.update:
          id: lbl_bed_target
          text: !lambda |-
            static char buf[16];
            snprintf(buf, sizeof(buf), "/ %.0f°C", x);
            return buf;

  - platform: homeassistant
    id: print_progress
    entity_id: sensor.p1s_01p00c581002790_progreso_de_la_impresion
    on_value:
      - lvgl.bar.update:
          id: progress_bar
          value: !lambda return (int)x;
      - lvgl.label.update:
          id: lbl_progress
          text: !lambda |-
            static char buf[8];
            snprintf(buf, sizeof(buf), "%.0f%%", x);
            return buf;

  - platform: homeassistant
    id: print_time_remaining
    entity_id: sensor.p1s_01p00c581002790_tiempo_restante
    on_value:
      - lvgl.label.update:
          id: lbl_remaining
          text: !lambda |-
            static char buf[24];
            float hours = x;
            int h = (int)hours;
            int m = (int)((hours - h) * 60);
            snprintf(buf, sizeof(buf), "Restante: %dh %02dm", h, m);
            return buf;

  - platform: homeassistant
    id: current_layer
    entity_id: sensor.p1s_01p00c581002790_capa_actual

  - platform: homeassistant
    id: total_layers
    entity_id: sensor.p1s_01p00c581002790_cantidad_total_de_capas

  - platform: wifi_signal
    id: wifi_signal_db
    update_interval: 30s

text_sensor:
  - platform: homeassistant
    id: printer_status
    entity_id: sensor.p1s_01p00c581002790_estado_actual
    on_value:
      - lvgl.label.update:
          id: lbl_status
          text: !lambda return x.c_str();

  - platform: homeassistant
    id: gcode_state
    entity_id: sensor.p1s_01p00c581002790_estado_de_la_impresion

  - platform: homeassistant
    id: current_file
    entity_id: sensor.p1s_01p00c581002790_nombre_de_la_tarea
    on_value:
      - lvgl.label.update:
          id: lbl_filename
          text: !lambda |-
            if (x == "unavailable" || x.empty()) {
              return "Sin tarea";
            }
            return x.c_str();

# Backlight
output:
  - platform: ledc
    pin: GPIO2
    frequency: 1220Hz
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

# I2C para touch
i2c:
  sda: GPIO19
  scl: GPIO20
  scan: false

touchscreen:
  - platform: gt911
    id: my_touch
    on_touch:
      - lambda: |-
          id(last_touch_time) = millis();
          if (id(screen_dimmed)) {
            id(screen_dimmed) = false;
            id(backlight).turn_on().set_brightness(1.0).perform();
          }

# Display
display:
  - platform: rpi_dpi_rgb
    id: my_display
    color_order: RGB
    invert_colors: false
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 480
    de_pin: GPIO40
    hsync_pin: GPIO39
    vsync_pin: GPIO41
    pclk_pin: GPIO42
    pclk_frequency: 16MHz
    pclk_inverted: false
    hsync_front_porch: 40
    hsync_pulse_width: 48
    hsync_back_porch: 40
    vsync_front_porch: 13
    vsync_pulse_width: 3
    vsync_back_porch: 32
    data_pins:
      red: [GPIO45, GPIO48, GPIO47, GPIO21, GPIO14]
      green: [GPIO5, GPIO6, GPIO7, GPIO15, GPIO16, GPIO4]
      blue: [GPIO8, GPIO3, GPIO46, GPIO9, GPIO10]

# Colores estilo Bambu
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  color_depth: 16
  style_definitions:
    - id: style_card
      bg_color: 0x1E1E1E
      radius: 12
      pad_all: 10
      border_width: 0
    - id: style_temp_icon
      text_color: 0x00AE42
      text_font: montserrat_28
    - id: style_temp_value
      text_color: 0xFFFFFF
      text_font: montserrat_36
    - id: style_temp_target
      text_color: 0x008844
      text_font: montserrat_18
    - id: style_title
      text_color: 0x00AE42
      text_font: montserrat_22
    - id: style_button
      bg_color: 0x00AE42
      text_color: 0xFFFFFF
      radius: 8
    - id: style_button_red
      bg_color: 0xE53935
      text_color: 0xFFFFFF
      radius: 8

  pages:
    - id: main_page
      bg_color: 0x121212
      widgets:
        # === Header ===
        - label:
            align: TOP_LEFT
            x: 20
            y: 15
            text_font: montserrat_28
            text_color: 0x00AE42
            text: "BAMBU LAB P1S"
            id: lbl_title

        - label:
            align: TOP_RIGHT
            x: -20
            y: 15
            text_font: montserrat_22
            text_color: 0xFFFFFF
            text: "--:--"
            id: lbl_clock

        # === Tarjeta Temperaturas (izquierda) ===
        - obj:
            align: TOP_LEFT
            x: 20
            y: 60
            width: 240
            height: 280
            styles: style_card
            widgets:
              # Nozzle
              - label:
                  x: 10
                  y: 15
                  text: "Boquilla"
                  text_color: 0x008844
                  text_font: montserrat_18
              - label:
                  x: 10
                  y: 45
                  text: "---°C"
                  text_color: 0xFFFFFF
                  text_font: montserrat_36
                  id: lbl_nozzle
              - label:
                  x: 130
                  y: 55
                  text: "/ ---°C"
                  text_color: 0x006633
                  text_font: montserrat_18
                  id: lbl_nozzle_target

              # Bed
              - label:
                  x: 10
                  y: 110
                  text: "Cama"
                  text_color: 0x008844
                  text_font: montserrat_18
              - label:
                  x: 10
                  y: 140
                  text: "---°C"
                  text_color: 0xFFFFFF
                  text_font: montserrat_36
                  id: lbl_bed
              - label:
                  x: 130
                  y: 150
                  text: "/ ---°C"
                  text_color: 0x006633
                  text_font: montserrat_18
                  id: lbl_bed_target

              # Estado filamento
              - label:
                  x: 10
                  y: 205
                  text: "Filamento"
                  text_color: 0x008844
                  text_font: montserrat_18
              - label:
                  x: 10
                  y: 230
                  text: "PLA"
                  text_color: 0x00AE42
                  text_font: montserrat_28
                  id: lbl_filament

        # === Tarjeta Progreso (centro) ===
        - obj:
            align: TOP_MID
            x: 0
            y: 60
            width: 280
            height: 280
            styles: style_card
            widgets:
              - label:
                  align: TOP_MID
                  y: 10
                  text: "idle"
                  text_color: 0x00AE42
                  text_font: montserrat_22
                  id: lbl_status

              - label:
                  align: TOP_MID
                  y: 45
                  text: "Sin tarea"
                  text_color: 0xCCCCCC
                  text_font: montserrat_18
                  long_mode: DOT
                  width: 250
                  id: lbl_filename

              # Porcentaje grande
              - label:
                  align: CENTER
                  y: -20
                  text: "0%"
                  text_color: 0xFFFFFF
                  text_font: montserrat_48
                  id: lbl_progress

              # Barra de progreso
              - bar:
                  align: CENTER
                  y: 40
                  width: 240
                  height: 16
                  min_value: 0
                  max_value: 100
                  value: 0
                  id: progress_bar
                  bg_color: 0x222222
                  indicator:
                    bg_color: 0x00AE42
                    radius: 8
                  radius: 8

              # Tiempo restante
              - label:
                  align: BOTTOM_MID
                  y: -15
                  text: "Restante: 0h 00m"
                  text_color: 0x008844
                  text_font: montserrat_18
                  id: lbl_remaining

        # === Tarjeta Controles (derecha) ===
        - obj:
            align: TOP_RIGHT
            x: -20
            y: 60
            width: 240
            height: 280
            styles: style_card
            widgets:
              - label:
                  align: TOP_MID
                  y: 5
                  text: "Control"
                  text_color: 0x00AE42
                  text_font: montserrat_22

              # Botón Pausar
              - button:
                  align: TOP_MID
                  y: 45
                  width: 200
                  height: 55
                  styles: style_button
                  widgets:
                    - label:
                        align: CENTER
                        text: "PAUSAR"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: button.press
                        data:
                          entity_id: button.p1s_01p00c581002790_pausar_la_impresion

              # Botón Reanudar
              - button:
                  align: CENTER
                  y: -20
                  width: 200
                  height: 55
                  styles: style_button
                  widgets:
                    - label:
                        align: CENTER
                        text: "REANUDAR"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: button.press
                        data:
                          entity_id: button.p1s_01p00c581002790_continuar_la_impresion

              # Botón Cancelar
              - button:
                  align: BOTTOM_MID
                  y: -15
                  width: 200
                  height: 55
                  styles: style_button_red
                  widgets:
                    - label:
                        align: CENTER
                        text: "CANCELAR"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: button.press
                        data:
                          entity_id: button.p1s_01p00c581002790_detener_la_impresion

        # === Footer con botones adicionales ===
        - obj:
            align: BOTTOM_MID
            y: -15
            width: 760
            height: 70
            styles: style_card
            widgets:
              # Precalentar PLA
              - button:
                  x: 10
                  y: 8
                  width: 170
                  height: 50
                  bg_color: 0x222222
                  radius: 8
                  widgets:
                    - label:
                        align: CENTER
                        text: "PREHEAT PLA"
                        text_color: 0xFFFFFF
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: "60"
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: "220"

              # Precalentar PETG
              - button:
                  x: 195
                  y: 8
                  width: 170
                  height: 50
                  bg_color: 0x222222
                  radius: 8
                  widgets:
                    - label:
                        align: CENTER
                        text: "PREHEAT PETG"
                        text_color: 0xFFFFFF
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: "80"
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: "250"

              # Enfriar
              - button:
                  x: 380
                  y: 8
                  width: 130
                  height: 50
                  bg_color: 0x222222
                  radius: 8
                  widgets:
                    - label:
                        align: CENTER
                        text: "ENFRIAR"
                        text_color: 0xFFFFFF
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: "0"
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: "0"

              # Luz
              - button:
                  x: 525
                  y: 8
                  width: 100
                  height: 50
                  bg_color: 0x222222
                  radius: 8
                  widgets:
                    - label:
                        align: CENTER
                        text: "LUZ"
                        text_color: 0xFFFFFF
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: light.p1s_01p00c581002790_luz_de_la_carcasa

              # Actualizar
              - button:
                  x: 640
                  y: 8
                  width: 110
                  height: 50
                  bg_color: 0x222222
                  radius: 8
                  widgets:
                    - label:
                        align: CENTER
                        text: "REFRESH"
                        text_color: 0xFFFFFF
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: button.press
                        data:
                          entity_id: button.p1s_01p00c581002790_forzar_actualizacion_de_datos

# Actualizar reloj y gestionar brillo
interval:
  - interval: 1s
    then:
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda |-
            static char buf[10];
            auto time = id(ha_time).now();
            snprintf(buf, sizeof(buf), "%02d:%02d", time.hour, time.minute);
            return buf;
      # Atenuar pantalla después de 60 segundos sin tocar
      - lambda: |-
          if (!id(screen_dimmed) && (millis() - id(last_touch_time) > 60000)) {
            id(screen_dimmed) = true;
            id(backlight).turn_on().set_brightness(0.15).perform();
          }
