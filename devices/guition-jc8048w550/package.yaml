# Guition JC8048W550 - Ejemplo basico reloj
# ESP32-S3 con pantalla 5" 800x480
# Compatible con Sunton ESP32-8048S050C

packages:
  base: !include ../common/guition-jc8048w550-base.yaml

# Touch sin callbacks (simple)
touchscreen:
  - platform: gt911
    id: my_touch

# Sensor WiFi
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 10s

# Fuentes
font:
  - file: "gfonts://Montserrat"
    id: montserrat_48
    size: 48
    bpp: 4

  - file: "gfonts://Montserrat"
    id: montserrat_28
    size: 28
    bpp: 4

  - file: "gfonts://Montserrat"
    id: montserrat_22
    size: 22
    bpp: 4

  - file: "gfonts://Montserrat"
    id: montserrat_18
    size: 18
    bpp: 4

# LVGL UI
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  pages:
    - id: main_page
      widgets:
        - label:
            align: TOP_MID
            y: 60
            text_font: montserrat_48
            text: "--:--"
            id: lbl_time
        - label:
            align: TOP_MID
            y: 130
            text_font: montserrat_28
            text: "-- --- ----"
            id: lbl_date
        - label:
            align: TOP_MID
            y: 200
            text_font: montserrat_18
            text: "WiFi: ---"
            id: lbl_wifi
        - button:
            align: CENTER
            y: 80
            width: 200
            height: 80
            widgets:
              - label:
                  align: CENTER
                  text: "TEST"
                  text_font: montserrat_28
            on_press:
              - logger.log: "Boton presionado!"
              - lvgl.label.update:
                  id: lbl_status
                  text: "Pulsado!"
            on_release:
              - lvgl.label.update:
                  id: lbl_status
                  text: ""
        - label:
            align: BOTTOM_MID
            y: -60
            text_font: montserrat_22
            text: ""
            id: lbl_status

interval:
  - interval: 1s
    then:
      - lvgl.label.update:
          id: lbl_time
          text: !lambda |-
            static char buf[10];
            auto time = id(ha_time).now();
            snprintf(buf, sizeof(buf), "%02d:%02d", time.hour, time.minute);
            return buf;
      - lvgl.label.update:
          id: lbl_date
          text: !lambda |-
            static char buf[20];
            static const char* months[] = {"Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"};
            auto time = id(ha_time).now();
            snprintf(buf, sizeof(buf), "%d %s %d", time.day_of_month, months[time.month-1], time.year);
            return buf;
  - interval: 10s
    then:
      - lvgl.label.update:
          id: lbl_wifi
          text: !lambda |-
            static char buf[40];
            if (id(wifi_signal_db).has_state()) {
              snprintf(buf, sizeof(buf), "WiFi: %.0f dBm", id(wifi_signal_db).state);
            } else {
              snprintf(buf, sizeof(buf), "WiFi: conectando...");
            }
            return buf;
