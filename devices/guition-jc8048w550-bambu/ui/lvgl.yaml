# LVGL UI - Panel Bambu Lab P1S
# Usa substitution: bambu_prefix, bambu_device_id

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  color_depth: 16

  style_definitions:
    - id: style_sidebar
      bg_color: 0x0D0D0D
      radius: 0
      border_width: 0
      pad_all: 0

    - id: style_sidebar_btn
      bg_color: 0x0D0D0D
      text_color: 0x666666
      radius: 8
      border_width: 0
      width: 80
      height: 80

    - id: style_sidebar_btn_active
      bg_color: 0x1A1A1A
      text_color: 0x00AE42
      radius: 8
      border_width: 0
      width: 80
      height: 80

    - id: style_card
      bg_color: 0x1E1E1E
      radius: 12
      pad_all: 12
      border_width: 0
      shadow_width: 8
      shadow_ofs_x: 2
      shadow_ofs_y: 2
      shadow_color: 0x000000
      shadow_opa: 30%

    - id: style_btn
      bg_color: 0x00AE42
      text_color: 0xFFFFFF
      radius: 12
      shadow_width: 6
      shadow_ofs_x: 2
      shadow_ofs_y: 2
      shadow_color: 0x000000
      shadow_opa: 50%

    - id: style_btn_dark
      bg_color: 0x2A2A2A
      text_color: 0xFFFFFF
      radius: 12
      shadow_width: 4
      shadow_ofs_x: 1
      shadow_ofs_y: 1
      shadow_color: 0x000000
      shadow_opa: 40%

    - id: style_btn_red
      bg_color: 0xE53935
      text_color: 0xFFFFFF
      radius: 12
      shadow_width: 6
      shadow_ofs_x: 2
      shadow_ofs_y: 2
      shadow_color: 0x000000
      shadow_opa: 50%

    - id: style_btn_disabled
      bg_color: 0x1A1A1A
      text_color: 0x555555
      radius: 12

    - id: style_motion_btn
      bg_color: 0x2A2A2A
      text_color: 0xFFFFFF
      radius: 30
      width: 60
      height: 60

  # === SIDEBAR (siempre visible) ===
  top_layer:
    widgets:
      - obj:
          id: sidebar
          width: 80
          height: 480
          x: 0
          y: 0
          styles: style_sidebar
          pad_all: 0
          widgets:
            # Home
            - button:
                id: btn_nav_home
                x: 0
                y: 40
                styles: style_sidebar_btn_active
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F02DC"
                      text_font: mdi_32
                on_press:
                  - lvgl.page.show: main_page
                  - lvgl.widget.update:
                      id: btn_nav_home
                      text_color: 0x00AE42
                      bg_color: 0x1A1A1A
                  - lvgl.widget.update:
                      id: btn_nav_controls
                      text_color: 0x666666
                      bg_color: 0x0D0D0D
                  - lvgl.widget.update:
                      id: btn_nav_motion
                      text_color: 0x666666
                      bg_color: 0x0D0D0D
                  - lvgl.widget.update:
                      id: btn_nav_info
                      text_color: 0x666666
                      bg_color: 0x0D0D0D

            # Controles
            - button:
                id: btn_nav_controls
                x: 0
                y: 140
                styles: style_sidebar_btn
                widgets:
                  - label:
                      id: lbl_nav_controls
                      align: CENTER
                      text: "\U000F0493"
                      text_font: mdi_32
                on_press:
                  - if:
                      condition:
                        binary_sensor.is_on: printer_online
                      then:
                        - lvgl.page.show: controls_page
                        - lvgl.widget.update:
                            id: btn_nav_home
                            text_color: 0x666666
                            bg_color: 0x0D0D0D
                        - lvgl.widget.update:
                            id: btn_nav_controls
                            text_color: 0x00AE42
                            bg_color: 0x1A1A1A
                        - lvgl.widget.update:
                            id: btn_nav_motion
                            text_color: 0x666666
                            bg_color: 0x0D0D0D
                        - lvgl.widget.update:
                            id: btn_nav_info
                            text_color: 0x666666
                            bg_color: 0x0D0D0D

            # Motion
            - button:
                id: btn_nav_motion
                x: 0
                y: 240
                styles: style_sidebar_btn
                widgets:
                  - label:
                      id: lbl_nav_motion
                      align: CENTER
                      text: "\U000F0C90"
                      text_font: mdi_32
                on_press:
                  - if:
                      condition:
                        binary_sensor.is_on: printer_online
                      then:
                        - lvgl.page.show: motion_page
                        - lvgl.widget.update:
                            id: btn_nav_home
                            text_color: 0x666666
                            bg_color: 0x0D0D0D
                        - lvgl.widget.update:
                            id: btn_nav_controls
                            text_color: 0x666666
                            bg_color: 0x0D0D0D
                        - lvgl.widget.update:
                            id: btn_nav_motion
                            text_color: 0x00AE42
                            bg_color: 0x1A1A1A
                        - lvgl.widget.update:
                            id: btn_nav_info
                            text_color: 0x666666
                            bg_color: 0x0D0D0D

            # Info
            - button:
                id: btn_nav_info
                x: 0
                y: 340
                styles: style_sidebar_btn
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F02FC"
                      text_font: mdi_32
                on_press:
                  - lvgl.page.show: info_page
                  - lvgl.widget.update:
                      id: btn_nav_home
                      text_color: 0x666666
                      bg_color: 0x0D0D0D
                  - lvgl.widget.update:
                      id: btn_nav_controls
                      text_color: 0x666666
                      bg_color: 0x0D0D0D
                  - lvgl.widget.update:
                      id: btn_nav_motion
                      text_color: 0x666666
                      bg_color: 0x0D0D0D
                  - lvgl.widget.update:
                      id: btn_nav_info
                      text_color: 0x00AE42
                      bg_color: 0x1A1A1A

            # Error indicator (visible cuando hay error)
            - label:
                id: lbl_error_indicator
                x: 24
                y: 440
                text: "\U000F0026"
                text_font: mdi_32
                text_color: 0xFF4444
                hidden: true

      # Touch blocker overlay - captura toques por 500ms al despertar
      - button:
          id: touch_blocker
          x: 0
          y: 0
          width: 800
          height: 480
          bg_opa: 0%
          border_width: 0
          shadow_width: 0
          hidden: true

  # === PAGINAS ===
  pages:
    # ==================== HOME ====================
    - id: main_page
      bg_color: 0x121212
      widgets:
        # === HEADER ===
        - label:
            x: 100
            y: 10
            text: "BAMBU P1S"
            text_font: montserrat_22
            text_color: 0x00AE42

        - label:
            id: lbl_status
            x: 250
            y: 10
            text: "Idle"
            text_font: montserrat_22
            text_color: 0xFFFFFF

        - label:
            id: lbl_clock
            align: TOP_RIGHT
            x: -20
            y: 10
            text: "--:--"
            text_font: montserrat_22
            text_color: 0xFFFFFF

        # Nombre del archivo (mas grande, con icono)
        - label:
            x: 100
            y: 42
            text: "\U000F0214"
            text_font: mdi_32
            text_color: 0x00AE42

        - label:
            id: lbl_filename
            x: 140
            y: 45
            width: 630
            text: "---"
            text_font: montserrat_22
            text_color: 0xFFFFFF
            long_mode: DOT

        # === CENTRO: Temperaturas y Ventiladores ===
        # Nozzle
        - label:
            id: icon_nozzle
            x: 120
            y: 85
            text: "\U000F18B8"
            text_font: mdi_48
            text_color: 0x00AE42

        - label:
            id: lbl_nozzle
            x: 180
            y: 90
            text: "---"
            text_font: montserrat_48
            text_color: 0xFFFFFF

        - label:
            x: 280
            y: 105
            text: "°C"
            text_font: montserrat_22
            text_color: 0x888888

        # Bed
        - label:
            id: icon_bed
            x: 360
            y: 85
            text: "\U000F0157"
            text_font: mdi_48
            text_color: 0x00AE42

        - label:
            id: lbl_bed
            x: 420
            y: 90
            text: "---"
            text_font: montserrat_48
            text_color: 0xFFFFFF

        - label:
            x: 520
            y: 105
            text: "°C"
            text_font: montserrat_22
            text_color: 0x888888

        # Ventiladores (3 en fila)
        # Cooling Fan
        - label:
            x: 120
            y: 155
            text: "\U000F0210"
            text_font: mdi_32
            text_color: 0x00AE42

        - label:
            id: lbl_cooling_fan
            x: 158
            y: 158
            text: "--"
            text_font: montserrat_22
            text_color: 0xFFFFFF

        - label:
            x: 215
            y: 158
            text: "Cool"
            text_font: montserrat_18
            text_color: 0x666666

        # Aux Fan
        - label:
            x: 310
            y: 155
            text: "\U000F0210"
            text_font: mdi_32
            text_color: 0x888888

        - label:
            id: lbl_aux_fan
            x: 348
            y: 158
            text: "--"
            text_font: montserrat_22
            text_color: 0xFFFFFF

        - label:
            x: 405
            y: 158
            text: "Aux"
            text_font: montserrat_18
            text_color: 0x666666

        # Chamber Fan
        - label:
            x: 490
            y: 155
            text: "\U000F0210"
            text_font: mdi_32
            text_color: 0x888888

        - label:
            id: lbl_chamber_fan
            x: 528
            y: 158
            text: "--"
            text_font: montserrat_22
            text_color: 0xFFFFFF

        - label:
            x: 585
            y: 158
            text: "Cham"
            text_font: montserrat_18
            text_color: 0x666666

        # === BOTONES: Pause/Resume y Stop ===
        # PAUSE - visible cuando está imprimiendo
        - button:
            id: btn_pause
            x: 100
            y: 200
            width: 330
            height: 80
            styles: style_btn
            widgets:
              - label:
                  align: CENTER
                  x: -30
                  text: "\U000F03E4"
                  text_font: mdi_48
              - label:
                  align: CENTER
                  x: 40
                  text: "PAUSE"
                  text_font: montserrat_28
            on_press:
              - lvgl.page.show: confirm_pause_page

        # RESUME - visible cuando está pausado (oculto por defecto)
        - button:
            id: btn_resume
            x: 100
            y: 200
            width: 330
            height: 80
            hidden: true
            styles: style_btn
            widgets:
              - label:
                  align: CENTER
                  x: -40
                  text: "\U000F040A"
                  text_font: mdi_48
              - label:
                  align: CENTER
                  x: 45
                  text: "RESUME"
                  text_font: montserrat_28
            on_press:
              - homeassistant.action:
                  action: button.press
                  data:
                    entity_id: button.${bambu_prefix}_continuar_la_impresion

        # STOP - visible cuando imprimiendo/pausado
        - button:
            id: btn_stop
            x: 450
            y: 200
            width: 320
            height: 80
            styles: style_btn_red
            widgets:
              - label:
                  align: CENTER
                  x: -30
                  text: "\U000F04DB"
                  text_font: mdi_48
              - label:
                  align: CENTER
                  x: 35
                  text: "STOP"
                  text_font: montserrat_28
            on_press:
              - lvgl.page.show: confirm_stop_page

        # LIGHT - visible cuando idle (reemplaza STOP)
        - button:
            id: btn_light_home
            x: 450
            y: 200
            width: 320
            height: 80
            hidden: true
            radius: 12
            bg_color: 0x1E1E1E
            widgets:
              - label:
                  id: icon_light_home
                  align: CENTER
                  x: -30
                  text: "\U000F0336"
                  text_font: mdi_48
                  text_color: 0x888888
              - label:
                  id: lbl_light_home
                  align: CENTER
                  x: 35
                  text: "LIGHT"
                  text_font: montserrat_28
                  text_color: 0x888888
            on_press:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.${bambu_prefix}_luz_de_la_carcasa

        # === BOTTOM: Gauge circular de progreso ===
        # Capas (izquierda)
        - label:
            x: 110
            y: 320
            text: "\U000F0E4B"
            text_font: mdi_32
            text_color: 0x00AE42

        - label:
            id: lbl_layers
            x: 150
            y: 323
            text: "-- / --"
            text_font: montserrat_22
            text_color: 0xFFFFFF

        # Gauge circular (centro) - mas compacto
        - arc:
            id: progress_arc
            x: 320
            y: 300
            width: 140
            height: 140
            min_value: 0
            max_value: 100
            value: 0
            start_angle: 135
            end_angle: 45
            rotation: 0
            adjustable: false
            arc_color: 0x333333
            arc_width: 10
            indicator:
              arc_color: 0x00AE42
              arc_width: 10
            knob:
              bg_opa: 0%

        # Porcentaje en centro del gauge
        - label:
            id: lbl_progress
            x: 355
            y: 345
            width: 70
            text: "0%"
            text_font: montserrat_36
            text_color: 0xFFFFFF
            text_align: CENTER

        # Tiempo restante (derecha)
        - label:
            x: 540
            y: 320
            text: "\U000F0150"
            text_font: mdi_32
            text_color: 0x00AE42

        - label:
            id: lbl_remaining
            x: 580
            y: 323
            text: "--:--"
            text_font: montserrat_22
            text_color: 0xFFFFFF

        - label:
            x: 650
            y: 323
            text: "rest"
            text_font: montserrat_18
            text_color: 0x666666

        # Fin estimado (debajo del gauge, separado)
        - label:
            x: 310
            y: 450
            text: "Fin estimado"
            text_font: montserrat_18
            text_color: 0x666666

        - label:
            id: lbl_finish_time
            x: 450
            y: 447
            text: "--:--"
            text_font: montserrat_28
            text_color: 0x00AE42

    # ==================== CONTROLS ====================
    - id: controls_page
      bg_color: 0x121212
      widgets:
        - label:
            x: 100
            y: 15
            text: "Controles"
            text_font: montserrat_28
            text_color: 0x00AE42

        # Card Nozzle
        - obj:
            x: 100
            y: 60
            width: 320
            height: 200
            styles: style_card
            scrollbar_mode: "off"
            scrollable: false
            widgets:
              - label:
                  x: 10
                  y: 5
                  text: "\U000F18B8"
                  text_font: mdi_48
                  text_color: 0x00AE42

              - label:
                  id: lbl_nozzle_ctrl
                  x: 65
                  y: 15
                  text: "---°C / ---°C"
                  text_font: montserrat_28
                  text_color: 0xFFFFFF

              - button:
                  x: 10
                  y: 70
                  width: 68
                  height: 50
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-10"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return std::max(0.0f, id(nozzle_target).state - 10);"

              - button:
                  x: 83
                  y: 70
                  width: 68
                  height: 50
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-5"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return std::max(0.0f, id(nozzle_target).state - 5);"

              - button:
                  x: 156
                  y: 70
                  width: 68
                  height: 50
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+5"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return id(nozzle_target).state + 5;"

              - button:
                  x: 229
                  y: 70
                  width: 68
                  height: 50
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+10"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return id(nozzle_target).state + 10;"

              - button:
                  x: 10
                  y: 130
                  width: 287
                  height: 50
                  styles: style_btn_red
                  widgets:
                    - label:
                        align: CENTER
                        text: "ENFRIAR"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                          value: "0"

        # Card Bed
        - obj:
            x: 440
            y: 60
            width: 320
            height: 200
            styles: style_card
            scrollbar_mode: "off"
            scrollable: false
            widgets:
              - label:
                  x: 10
                  y: 5
                  text: "\U000F0157"
                  text_font: mdi_48
                  text_color: 0x00AE42

              - label:
                  id: lbl_bed_ctrl
                  x: 65
                  y: 15
                  text: "---°C / ---°C"
                  text_font: montserrat_28
                  text_color: 0xFFFFFF

              - button:
                  x: 10
                  y: 70
                  width: 68
                  height: 50
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-10"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_cama
                          value: !lambda "return std::max(0.0f, id(bed_target).state - 10);"

              - button:
                  x: 83
                  y: 70
                  width: 68
                  height: 50
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-5"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_cama
                          value: !lambda "return std::max(0.0f, id(bed_target).state - 5);"

              - button:
                  x: 156
                  y: 70
                  width: 68
                  height: 50
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+5"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_cama
                          value: !lambda "return id(bed_target).state + 5;"

              - button:
                  x: 229
                  y: 70
                  width: 68
                  height: 50
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+10"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_cama
                          value: !lambda "return id(bed_target).state + 10;"

              - button:
                  x: 10
                  y: 130
                  width: 287
                  height: 50
                  styles: style_btn_red
                  widgets:
                    - label:
                        align: CENTER
                        text: "ENFRIAR"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_cama
                          value: "0"

        # PRESETS button
        - button:
            x: 100
            y: 300
            width: 215
            height: 160
            radius: 12
            bg_color: 0x1E1E1E
            widgets:
              - label:
                  align: CENTER
                  y: -20
                  text: "\U000F0493"
                  text_font: mdi_48
                  text_color: 0x00AE42
              - label:
                  align: CENTER
                  y: 40
                  text: "PRESETS"
                  text_font: montserrat_22
                  text_color: 0xFFFFFF
            on_press:
              - lvgl.page.show: controls_presets_page

        # LIGHT toggle con feedback
        - button:
            id: btn_light
            x: 325
            y: 300
            width: 215
            height: 160
            radius: 12
            bg_color: 0x1E1E1E
            widgets:
              - label:
                  id: lbl_light_icon
                  align: CENTER
                  y: -20
                  text: "\U000F0336"
                  text_font: mdi_48
                  text_color: 0x888888
              - label:
                  id: lbl_light_text
                  align: CENTER
                  y: 40
                  text: "LIGHT"
                  text_font: montserrat_22
                  text_color: 0x888888
            on_press:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.${bambu_prefix}_luz_de_la_carcasa

        # FANS button
        - button:
            x: 550
            y: 300
            width: 215
            height: 160
            radius: 12
            bg_color: 0x1E1E1E
            widgets:
              - label:
                  align: CENTER
                  y: -20
                  text: "\U000F0210"
                  text_font: mdi_48
                  text_color: 0x00AE42
              - label:
                  align: CENTER
                  y: 40
                  text: "FANS"
                  text_font: montserrat_22
                  text_color: 0xFFFFFF
            on_press:
              - lvgl.page.show: fans_page

    # ==================== PRESETS ====================
    - id: controls_presets_page
      bg_color: 0x121212
      widgets:
        - button:
            x: 100
            y: 10
            width: 80
            height: 50
            radius: 8
            bg_color: 0x2A2A2A
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0141"
                  text_font: mdi_32
                  text_color: 0xFFFFFF
            on_press:
              - lvgl.page.show: controls_page

        - label:
            x: 200
            y: 20
            text: "PRESETS"
            text_font: montserrat_28
            text_color: 0x00AE42

        # PLA
        - button:
            x: 100
            y: 80
            width: 335
            height: 120
            radius: 12
            bg_color: 0x00AE42
            widgets:
              - label:
                  align: CENTER
                  y: -15
                  text: "PLA"
