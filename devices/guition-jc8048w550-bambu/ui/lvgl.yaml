# LVGL UI - Panel Bambu Lab P1S
# Usa substitution: bambu_prefix, bambu_device_id

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  color_depth: 16

  style_definitions:
    - id: style_sidebar
      bg_color: 0x1A1A1A
      radius: 0
      border_width: 0
      pad_all: 0

    - id: style_sidebar_btn
      bg_color: 0x1A1A1A
      text_color: 0x888888
      radius: 0
      border_width: 0
      width: 80
      height: 80

    - id: style_sidebar_btn_active
      bg_color: 0x1A1A1A
      text_color: 0x00AE42
      radius: 0
      border_width: 0

    - id: style_card
      bg_color: 0x1E1E1E
      radius: 12
      pad_all: 12
      border_width: 0

    - id: style_btn
      bg_color: 0x00AE42
      text_color: 0xFFFFFF
      radius: 8

    - id: style_btn_dark
      bg_color: 0x2A2A2A
      text_color: 0xFFFFFF
      radius: 8

    - id: style_btn_red
      bg_color: 0xE53935
      text_color: 0xFFFFFF
      radius: 8

    - id: style_motion_btn
      bg_color: 0x2A2A2A
      text_color: 0xFFFFFF
      radius: 30
      width: 60
      height: 60

  # === SIDEBAR (siempre visible) ===
  top_layer:
    widgets:
      - obj:
          id: sidebar
          width: 80
          height: 480
          x: 0
          y: 0
          styles: style_sidebar
          pad_all: 0
          widgets:
            # Home
            - button:
                id: btn_nav_home
                x: 0
                y: 32
                styles: style_sidebar_btn_active
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F02DC"
                      text_font: mdi_32
                on_press:
                  - lvgl.page.show: main_page
                  - lvgl.widget.update:
                      id: btn_nav_home
                      text_color: 0x00AE42
                  - lvgl.widget.update:
                      id: btn_nav_controls
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_motion
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_info
                      text_color: 0x888888

            # Controles
            - button:
                id: btn_nav_controls
                x: 0
                y: 144
                styles: style_sidebar_btn
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F0493"
                      text_font: mdi_32
                on_press:
                  - lvgl.page.show: controls_page
                  - lvgl.widget.update:
                      id: btn_nav_home
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_controls
                      text_color: 0x00AE42
                  - lvgl.widget.update:
                      id: btn_nav_motion
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_info
                      text_color: 0x888888

            # Motion
            - button:
                id: btn_nav_motion
                x: 0
                y: 256
                styles: style_sidebar_btn
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F0C90"
                      text_font: mdi_32
                on_press:
                  - lvgl.page.show: motion_page
                  - lvgl.widget.update:
                      id: btn_nav_home
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_controls
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_motion
                      text_color: 0x00AE42
                  - lvgl.widget.update:
                      id: btn_nav_info
                      text_color: 0x888888

            # Info
            - button:
                id: btn_nav_info
                x: 0
                y: 368
                styles: style_sidebar_btn
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F02FC"
                      text_font: mdi_32
                on_press:
                  - lvgl.page.show: info_page
                  - lvgl.widget.update:
                      id: btn_nav_home
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_controls
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_motion
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_info
                      text_color: 0x00AE42

  # === PAGINAS ===
  pages:
    # ==================== HOME ====================
    - id: main_page
      bg_color: 0x121212
      widgets:
        # Header
        - label:
            x: 100
            y: 10
            text: "BAMBU P1S"
            text_font: montserrat_28
            text_color: 0x00AE42

        - label:
            id: lbl_clock
            align: TOP_RIGHT
            x: -20
            y: 10
            text: "--:--"
            text_font: montserrat_28
            text_color: 0xFFFFFF

        # Estado actual
        - label:
            id: lbl_status
            x: 100
            y: 50
            text: "Idle"
            text_font: montserrat_28
            text_color: 0x00AE42

        # Progreso GIGANTE
        - label:
            id: lbl_progress
            align: TOP_MID
            x: 30
            y: 100
            text: "0%"
            text_font: montserrat_48
            text_color: 0xFFFFFF

        - bar:
            id: progress_bar
            x: 100
            y: 180
            width: 480
            height: 24
            min_value: 0
            max_value: 100
            value: 0
            bg_color: 0x333333
            radius: 12
            indicator:
              bg_color: 0x00AE42
              radius: 12

        # Tiempo restante
        - label:
            id: lbl_remaining
            x: 100
            y: 220
            text: "-- restante"
            text_font: montserrat_28
            text_color: 0x888888

        # Temperaturas lado derecho
        - label:
            x: 600
            y: 100
            text: "\U000F18B8"
            text_font: mdi_48
            text_color: 0x00AE42

        - label:
            id: lbl_nozzle
            x: 660
            y: 105
            text: "---"
            text_font: montserrat_36
            text_color: 0xFFFFFF

        - label:
            x: 600
            y: 170
            text: "\U000F0157"
            text_font: mdi_48
            text_color: 0x00AE42

        - label:
            id: lbl_bed
            x: 660
            y: 175
            text: "---"
            text_font: montserrat_36
            text_color: 0xFFFFFF

        # Botones: Pause, Resume, Stop
        - button:
            x: 100
            y: 280
            width: 210
            height: 90
            styles: style_btn
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F04DB"
                  text_font: mdi_48
            on_press:
              - homeassistant.action:
                  action: button.press
                  data:
                    entity_id: button.${bambu_prefix}_pausar_la_impresion

        - button:
            x: 330
            y: 280
            width: 210
            height: 90
            styles: style_btn
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F040A"
                  text_font: mdi_48
            on_press:
              - homeassistant.action:
                  action: button.press
                  data:
                    entity_id: button.${bambu_prefix}_continuar_la_impresion

        - button:
            x: 560
            y: 280
            width: 210
            height: 90
            styles: style_btn_red
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F04D8"
                  text_font: mdi_48
            on_press:
              - homeassistant.action:
                  action: button.press
                  data:
                    entity_id: button.${bambu_prefix}_detener_la_impresion

        # Capas
        - label:
            x: 100
            y: 400
            text: "\U000F0E4B"
            text_font: mdi_48
            text_color: 0x00AE42

        - label:
            id: lbl_layers
            x: 160
            y: 405
            text: "-- / --"
            text_font: montserrat_36
            text_color: 0xFFFFFF

    # ==================== CONTROLS ====================
    - id: controls_page
      bg_color: 0x121212
      widgets:
        - label:
            x: 100
            y: 15
            text: "Controles"
            text_font: montserrat_28
            text_color: 0x00AE42

        # Card Nozzle
        - obj:
            x: 100
            y: 60
            width: 340
            height: 220
            styles: style_card
            scrollbar_mode: "off"
            scrollable: false
            widgets:
              - label:
                  x: 10
                  y: 10
                  text: "\U000F18B8"
                  text_font: mdi_48
                  text_color: 0x00AE42

              - label:
                  id: lbl_nozzle_ctrl
                  x: 70
                  y: 20
                  text: "---°C / ---°C"
                  text_font: montserrat_36
                  text_color: 0xFFFFFF

              - button:
                  x: 10
                  y: 90
                  width: 75
                  height: 55
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-10"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return std::max(0.0f, id(nozzle_target).state - 10);"

              - button:
                  x: 90
                  y: 90
                  width: 70
                  height: 55
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-1"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return std::max(0.0f, id(nozzle_target).state - 1);"

              - button:
                  x: 165
                  y: 90
                  width: 70
                  height: 55
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+1"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return id(nozzle_target).state + 1;"

              - button:
                  x: 240
                  y: 90
                  width: 75
                  height: 55
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+10"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return id(nozzle_target).state + 10;"

              - button:
                  x: 10
                  y: 155
                  width: 305
                  height: 50
                  styles: style_btn_red
                  widgets:
                    - label:
                        align: CENTER
                        text: "ENFRIAR"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                          value: "0"

        # Card Bed
        - obj:
            x: 460
            y: 60
            width: 320
            height: 220
            styles: style_card
            scrollbar_mode: "off"
            scrollable: false
            widgets:
              - label:
                  x: 10
                  y: 10
                  text: "\U000F0157"
                  text_font: mdi_48
                  text_color: 0x00AE42

              - label:
                  id: lbl_bed_ctrl
                  x: 70
                  y: 20
                  text: "---°C / ---°C"
                  text_font: montserrat_36
                  text_color: 0xFFFFFF

              - button:
                  x: 10
                  y: 90
                  width: 75
                  height: 55
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-10"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_cama
                          value: !lambda "return std::max(0.0f, id(bed_target).state - 10);"

              - button:
                  x: 90
                  y: 90
                  width: 70
                  height: 55
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-1"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_cama
                          value: !lambda "return std::max(0.0f, id(bed_target).state - 1);"

              - button:
                  x: 165
                  y: 90
                  width: 70
                  height: 55
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+1"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_cama
                          value: !lambda "return id(bed_target).state + 1;"

              - button:
                  x: 240
                  y: 90
                  width: 75
                  height: 55
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+10"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_cama
                          value: !lambda "return id(bed_target).state + 10;"

              - button:
                  x: 10
                  y: 155
                  width: 305
                  height: 50
                  styles: style_btn_red
                  widgets:
                    - label:
                        align: CENTER
                        text: "ENFRIAR"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_cama
                          value: "0"

        # PRESETS button
        - button:
            x: 100
            y: 300
            width: 340
            height: 160
            radius: 12
            bg_color: 0x1E1E1E
            widgets:
              - label:
                  align: CENTER
                  y: -20
                  text: "\U000F0493"
                  text_font: mdi_48
                  text_color: 0x00AE42
              - label:
                  align: CENTER
                  y: 40
                  text: "PRESETS"
                  text_font: montserrat_28
                  text_color: 0xFFFFFF
            on_press:
              - lvgl.page.show: controls_presets_page

        # LIGHT toggle con feedback
        - button:
            id: btn_light
            x: 440
            y: 300
            width: 340
            height: 160
            radius: 12
            bg_color: 0x1E1E1E
            widgets:
              - label:
                  id: lbl_light_icon
                  align: CENTER
                  y: -20
                  text: "\U000F0336"
                  text_font: mdi_48
                  text_color: 0x888888
              - label:
                  id: lbl_light_text
                  align: CENTER
                  y: 40
                  text: "LIGHT OFF"
                  text_font: montserrat_28
                  text_color: 0x888888
            on_press:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.${bambu_prefix}_luz_de_la_carcasa

    # ==================== PRESETS ====================
    - id: controls_presets_page
      bg_color: 0x121212
      widgets:
        - button:
            x: 100
            y: 10
            width: 80
            height: 50
            radius: 8
            bg_color: 0x2A2A2A
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0141"
                  text_font: mdi_32
                  text_color: 0xFFFFFF
            on_press:
              - lvgl.page.show: controls_page

        - label:
            x: 200
            y: 20
            text: "PRESETS"
            text_font: montserrat_28
            text_color: 0x00AE42

        # PLA
        - button:
            x: 100
            y: 80
            width: 335
            height: 120
            radius: 12
            bg_color: 0x00AE42
            widgets:
              - label:
                  align: CENTER
                  y: -15
                  text: "PLA"
                  text_font: montserrat_36
                  text_color: 0xFFFFFF
              - label:
                  align: CENTER
                  y: 30
                  text: "220 / 60"
                  text_font: montserrat_22
                  text_color: 0xFFFFFF
            on_press:
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                    value: "220"
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_cama
                    value: "60"
              - lvgl.page.show: controls_page

        # PETG
        - button:
            x: 445
            y: 80
            width: 335
            height: 120
            radius: 12
            bg_color: 0x00AE42
            widgets:
              - label:
                  align: CENTER
                  y: -15
                  text: "PETG"
                  text_font: montserrat_36
                  text_color: 0xFFFFFF
              - label:
                  align: CENTER
                  y: 30
                  text: "250 / 80"
                  text_font: montserrat_22
                  text_color: 0xFFFFFF
            on_press:
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                    value: "250"
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_cama
                    value: "80"
              - lvgl.page.show: controls_page

        # ABS
        - button:
            x: 100
            y: 220
            width: 335
            height: 120
            radius: 12
            bg_color: 0x00AE42
            widgets:
              - label:
                  align: CENTER
                  y: -15
                  text: "ABS"
                  text_font: montserrat_36
                  text_color: 0xFFFFFF
              - label:
                  align: CENTER
                  y: 30
                  text: "260 / 100"
                  text_font: montserrat_22
                  text_color: 0xFFFFFF
            on_press:
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                    value: "260"
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_cama
                    value: "100"
              - lvgl.page.show: controls_page

        # ENFRIAR TODO
        - button:
            x: 445
            y: 220
            width: 335
            height: 120
            radius: 12
            bg_color: 0xCC3333
            widgets:
              - label:
                  align: CENTER
                  y: -15
                  text: "ENFRIAR"
                  text_font: montserrat_36
                  text_color: 0xFFFFFF
              - label:
                  align: CENTER
                  y: 30
                  text: "0 / 0"
                  text_font: montserrat_22
                  text_color: 0xFFFFFF
            on_press:
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                    value: "0"
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_cama
                    value: "0"
              - lvgl.page.show: controls_page

        # CANCELAR
        - button:
            x: 100
            y: 360
            width: 680
            height: 100
            radius: 12
            bg_color: 0x2A2A2A
            widgets:
              - label:
                  align: CENTER
                  text: "CANCELAR"
                  text_font: montserrat_28
                  text_color: 0xFFFFFF
            on_press:
              - lvgl.page.show: controls_page

    # ==================== MOTION MENU ====================
    - id: motion_page
      bg_color: 0x121212
      widgets:
        - label:
            x: 100
            y: 15
            text: "Motion"
            text_font: montserrat_28
            text_color: 0x00AE42

        # TOOL HEAD
        - button:
            x: 100
            y: 70
            width: 330
            height: 380
            radius: 16
            bg_color: 0x1E1E1E
            widgets:
              - label:
                  align: CENTER
                  y: -40
                  text: "\U000F0C90"
                  text_font: mdi_48
                  text_color: 0x00AE42
              - label:
                  align: CENTER
                  y: 40
                  text: "TOOL HEAD"
                  text_font: montserrat_28
                  text_color: 0xFFFFFF
            on_press:
              - lvgl.page.show: motion_xy_page

        # BED
        - button:
            x: 450
            y: 70
            width: 330
            height: 380
            radius: 16
            bg_color: 0x1E1E1E
            widgets:
              - label:
                  align: CENTER
                  y: -40
                  text: "\U000F0157"
                  text_font: mdi_48
                  text_color: 0x00AE42
              - label:
                  align: CENTER
                  y: 40
                  text: "BED"
                  text_font: montserrat_28
                  text_color: 0xFFFFFF
            on_press:
              - lvgl.page.show: motion_z_page

    # ==================== MOTION XY ====================
    # Layout en "+" con HOME pequeño en centro
    - id: motion_xy_page
      bg_color: 0x121212
      widgets:
        # Header
        - button:
            x: 100
            y: 10
            width: 80
            height: 50
            radius: 8
            bg_color: 0x2A2A2A
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0141"
                  text_font: mdi_32
                  text_color: 0xFFFFFF
            on_press:
              - lvgl.page.show: motion_page

        - label:
            x: 200
            y: 20
            text: "TOOL HEAD"
            text_font: montserrat_28
            text_color: 0x00AE42

        # Columna Y arriba del HOME
        - button:
            x: 365
            y: 70
            width: 90
            height: 70
            radius: 10
            bg_color: 0x2A2A2A
            widgets:
              - label:
                  align: CENTER
                  text: "Y+10"
                  text_font: montserrat_22
                  text_color: 0x00AE42
            on_press:
              - homeassistant.action:
                  action: bambu_lab.send_command
                  data:
                    device_id: ${bambu_device_id}
                    command: "G91\nG0 Y10 F3000\nG90"

        - button:
            x: 365
            y: 150
            width: 90
            height: 70
            radius: 10
            bg_color: 0x333333
            widgets:
              - label:
                  align: CENTER
                  text: "Y+1"
                  text_font: montserrat_22
                  text_color: 0xCCCCCC
            on_press:
              - homeassistant.action:
                  action: bambu_lab.send_command
                  data:
                    device_id: ${bambu_device_id}
                    command: "G91\nG0 Y1 F3000\nG90"

        # Fila X izquierda
        - button:
            x: 150
            y: 235
            width: 90
            height: 70
            radius: 10
            bg_color: 0x2A2A2A
            widgets:
              - label:
                  align: CENTER
                  text: "X-10"
                  text_font: montserrat_22
                  text_color: 0x00AE42
            on_press:
              - homeassistant.action:
