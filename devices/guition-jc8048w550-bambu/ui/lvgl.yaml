# LVGL UI - Panel Bambu Lab P1S
# Usa substitution: bambu_prefix, bambu_device_id
#
# Estructura de ficheros:
#   ui/
#   ├── lvgl.yaml          <- Este fichero (orquestador)
#   ├── styles.yaml        <- Definiciones de estilos
#   ├── top_layer.yaml     <- Sidebar y touch blocker
#   └── pages/
#       ├── home.yaml         <- Pagina principal
#       ├── controls.yaml     <- Temperaturas
#       ├── presets.yaml      <- Presets de temperatura
#       ├── fans.yaml         <- Control de ventiladores
#       ├── motion.yaml       <- Menu movimiento
#       ├── motion_xy.yaml    <- Movimiento XY
#       ├── motion_z.yaml     <- Movimiento Z
#       ├── filament.yaml     <- Carga/descarga filamento
#       ├── confirm_pause.yaml <- Confirmacion pausa
#       ├── confirm_stop.yaml  <- Confirmacion stop
#       ├── info.yaml         <- Info del sistema
#       └── screensaver.yaml  <- Pantalla reposo

lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  color_depth: 16
  buffer_size: 25%

  style_definitions: !include styles.yaml

  top_layer: !include top_layer.yaml

  pages:
    - !include pages/home.yaml
    - !include pages/controls.yaml
    - !include pages/presets.yaml
    - !include pages/fans.yaml
    - !include pages/motion.yaml
    - !include pages/motion_xy.yaml
    - !include pages/motion_z.yaml
    - !include pages/filament.yaml
    - !include pages/confirm_pause.yaml
    - !include pages/confirm_stop.yaml
    - !include pages/skip_objects.yaml
    - !include pages/info.yaml
    - !include pages/screensaver.yaml
