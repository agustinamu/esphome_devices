# Motion Z Page - Control de movimiento de la cama
# Usa substitution: bambu_device_id

id: motion_z_page
bg_color: 0x121212
widgets:
  - button:
      x: 100
      y: 10
      width: 80
      height: 50
      radius: 8
      bg_color: 0x2A2A2A
      widgets:
        - label:
            align: CENTER
            text: "\U000F0141"
            text_font: mdi_32
            text_color: 0xFFFFFF
      on_press:
        - lvgl.page.show: motion_page

  - label:
      x: 200
      y: 20
      text: "BED (Z)"
      text_font: montserrat_28
      text_color: 0x00AE42

  # Warning message
  - label:
      x: 100
      y: 70
      width: 680
      text: "Asegurate que no hay nada debajo de la cama"
      text_font: montserrat_18
      text_color: 0xFFAA00

  # Posiciones absolutas seguras (alejan la cama del nozzle)
  - button:
      x: 100
      y: 110
      width: 215
      height: 120
      radius: 12
      bg_color: 0x2A2A2A
      widgets:
        - label:
            align: CENTER
            y: -15
            text: "Z = 250"
            text_font: montserrat_28
            text_color: 0x00AE42
        - label:
            align: CENTER
            y: 25
            text: "Abajo"
            text_font: montserrat_18
            text_color: 0x888888
      on_press:
        - homeassistant.action:
            action: bambu_lab.send_command
            data:
              device_id: ${bambu_device_id}
              command: "G90\nG0 Z250 F600"

  - button:
      x: 330
      y: 110
      width: 215
      height: 120
      radius: 12
      bg_color: 0x333333
      widgets:
        - label:
            align: CENTER
            y: -15
            text: "Z = 150"
            text_font: montserrat_28
            text_color: 0xCCCCCC
        - label:
            align: CENTER
            y: 25
            text: "Medio"
            text_font: montserrat_18
            text_color: 0x888888
      on_press:
        - homeassistant.action:
            action: bambu_lab.send_command
            data:
              device_id: ${bambu_device_id}
              command: "G90\nG0 Z150 F600"

  - button:
      x: 560
      y: 110
      width: 215
      height: 120
      radius: 12
      bg_color: 0x333333
      widgets:
        - label:
            align: CENTER
            y: -15
            text: "Z = 50"
            text_font: montserrat_28
            text_color: 0xCCCCCC
        - label:
            align: CENTER
            y: 25
            text: "Arriba"
            text_font: montserrat_18
            text_color: 0x888888
      on_press:
        - homeassistant.action:
            action: bambu_lab.send_command
            data:
              device_id: ${bambu_device_id}
              command: "G90\nG0 Z50 F600"

  # HOME Z
  - button:
      x: 100
      y: 260
      width: 675
      height: 100
      radius: 12
      bg_color: 0x00AE42
      widgets:
        - label:
            align: CENTER
            x: -60
            text: "\U000F0A12"
            text_font: mdi_48
            text_color: 0xFFFFFF
        - label:
            align: CENTER
            x: 30
            text: "HOME Z"
            text_font: montserrat_28
            text_color: 0xFFFFFF
      on_press:
        - homeassistant.action:
            action: bambu_lab.send_command
            data:
              device_id: ${bambu_device_id}
              command: "G28 Z"

  # Info
  - label:
      x: 100
      y: 390
      width: 680
      text: "Z mayor = cama mas abajo (seguro)"
      text_font: montserrat_18
      text_color: 0x666666
