# Skip Objects Page - Seleccionar objetos para omitir
# Usa substitution: bambu_device_id, bambu_prefix, ha_url
# Requiere: secret ha_token, template sensor p1s_printable_objects_list en HA

id: skip_objects_page
bg_color: 0x121212
widgets:
  # Header
  - button:
      x: 100
      y: 10
      width: 80
      height: 50
      radius: 8
      bg_color: 0x2A2A2A
      widgets:
        - label:
            align: CENTER
            text: "\U000F0141"
            text_font: mdi_32
            text_color: 0xFFFFFF
      on_press:
        - lambda: id(skip_selection) = 0;
        - lvgl.page.show: main_page

  - label:
      x: 200
      y: 15
      text: "\U000F04E2"
      text_font: mdi_32
      text_color: 0x00AE42

  - label:
      x: 240
      y: 18
      text: "SKIP OBJECTS"
      text_font: montserrat_28
      text_color: 0x00AE42

  - label:
      id: lbl_skip_count
      align: TOP_RIGHT
      x: -20
      y: 18
      text: ""
      text_font: montserrat_22
      text_color: 0x888888

  # === PLATE IMAGE (left side) ===
  - image:
      id: img_plate
      x: 105
      y: 70
      src: plate_image

  # === SKIP SELECTED BUTTON (below image) ===
  - button:
      id: btn_do_skip
      x: 105
      y: 285
      width: 200
      height: 50
      styles: style_btn_red
      hidden: true
      widgets:
        - label:
            align: CENTER
            text: "SKIP"
            text_font: montserrat_28
      on_press:
        - lambda: |-
            std::string data = id(printable_objects_list).state;
            std::string result = "";
            int idx = 0;
            int selection = id(skip_selection);
            size_t pos = 0;
            while (pos < data.size() && idx < 8) {
              size_t pipe = data.find('|', pos);
              if (pipe == std::string::npos) pipe = data.size();
              if (selection & (1 << idx)) {
                size_t colon = data.find(':', pos);
                if (colon < pipe) {
                  std::string obj_id = data.substr(pos, colon - pos);
                  if (!result.empty()) result += ",";
                  result += obj_id;
                }
              }
              pos = pipe + 1;
              idx++;
            }
            id(skip_ids_str) = result;
        - if:
            condition:
              lambda: return !id(skip_ids_str).empty();
            then:
              - homeassistant.action:
                  action: bambu_lab.skip_objects
                  data:
                    device_id: ${bambu_device_id}
                    objects: !lambda 'return id(skip_ids_str);'
              - lambda: |-
                  id(skip_selection) = 0;
                  id(skip_ids_str) = "";
              - lvgl.page.show: main_page

  # === 8 OBJECT ROWS (right side) ===
  # Row 0
  - button:
      id: btn_skip_0
      x: 320
      y: 68
      width: 450
      height: 42
      radius: 8
      bg_color: 0x2A2A2A
      border_width: 2
      border_color: 0x2A2A2A
      hidden: true
      widgets:
        - label:
            id: lbl_skip_0
            align: LEFT_MID
            x: 15
            text: ""
            text_font: montserrat_22
            text_color: 0xFFFFFF
            long_mode: DOT
            width: 420
      on_click:
        - lambda: id(skip_selection) ^= (1 << 0);
        - lvgl.widget.update:
            id: btn_skip_0
            border_color: !lambda |-
              return (id(skip_selection) & (1 << 0)) ? lv_color_hex(0x00AE42) : lv_color_hex(0x2A2A2A);
            bg_color: !lambda |-
              return (id(skip_selection) & (1 << 0)) ? lv_color_hex(0x1A3A1A) : lv_color_hex(0x2A2A2A);

