# Skip Objects Page - Seleccionar objetos para omitir
# Layout: imagen grande izquierda con overlays clickeables, lista derecha
# Usa substitution: bambu_device_id, bambu_prefix, ha_url

id: skip_objects_page
bg_color: 0x121212
widgets:
  # === HEADER ===
  - button:
      x: 100
      y: 10
      width: 80
      height: 50
      radius: 8
      bg_color: 0x2A2A2A
      widgets:
        - label:
            align: CENTER
            text: "\U000F0141"
            text_font: mdi_32
            text_color: 0xFFFFFF
      on_press:
        - lambda: id(skip_selection) = 0;
        - lvgl.page.show: main_page

  - label:
      x: 200
      y: 15
      text: "\U000F04E2"
      text_font: mdi_32
      text_color: 0x00AE42

  - label:
      x: 240
      y: 18
      text: "SKIP OBJECTS"
      text_font: montserrat_28
      text_color: 0x00AE42

  - label:
      id: lbl_skip_count
      align: TOP_RIGHT
      x: -20
      y: 18
      text: ""
      text_font: montserrat_22
      text_color: 0x888888

  # === PLATE IMAGE CONTAINER (left side, 380x380) ===
  # Container que agrupa imagen + overlays
  - obj:
      id: plate_container
      x: 10
      y: 65
      width: 380
      height: 380
      bg_opa: 0%
      border_width: 0
      pad_all: 0
      scrollbar_mode: "off"
      widgets:
        # Imagen del plato
        - image:
            id: img_plate
            x: 0
            y: 0
            src: plate_image

        # 8 overlay buttons (hidden by default, positioned by lambda)
        - button:
            id: btn_bbox_0
            x: 0
            y: 0
            width: 10
            height: 10
            hidden: true
            bg_opa: 0%
            border_width: 2
            border_color: 0x444444
            border_opa: 80%
            radius: 2
            on_click:
              - lambda: id(skip_selection) ^= (1 << 0);
              - lambda: |-
                  bool sel = id(skip_selection) & (1 << 0);
                  lv_obj_set_style_border_color(id(btn_bbox_0), sel ? lv_color_hex(0x00AE42) : lv_color_hex(0x444444), 0);
                  lv_obj_set_style_border_width(id(btn_bbox_0), sel ? 3 : 2, 0);
                  lv_obj_set_style_bg_opa(id(btn_bbox_0), sel ? 40 : 0, 0);
                  lv_obj_set_style_bg_color(id(btn_bbox_0), lv_color_hex(0x00AE42), 0);
                  // Update list row
                  lv_obj_set_style_border_color(id(btn_skip_0), sel ? lv_color_hex(0x00AE42) : lv_color_hex(0x2A2A2A), 0);
                  lv_obj_set_style_bg_color(id(btn_skip_0), sel ? lv_color_hex(0x1A3A1A) : lv_color_hex(0x2A2A2A), 0);
                  lv_label_set_text(id(lbl_check_0), sel ? "\U000F0134" : "\U000F0131");
                  lv_obj_set_style_text_color(id(lbl_check_0), sel ? lv_color_hex(0x00AE42) : lv_color_hex(0x555555), 0);

