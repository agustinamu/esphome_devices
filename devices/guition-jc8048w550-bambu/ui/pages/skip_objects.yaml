# Skip Objects Page - Seleccionar objetos para omitir
# Layout: imagen grande izquierda con overlays clickeables, lista derecha
# Usa substitution: bambu_device_id, bambu_prefix, ha_url

id: skip_objects_page
on_load:
  - script.execute:
      id: nav_highlight
      idx: 0
bg_color: 0x121212
widgets:
  # === HEADER ===
  - button:
      x: 100
      y: 10
      width: 80
      height: 50
      radius: 8
      bg_color: 0x2A2A2A
      widgets:
        - label:
            align: CENTER
            text: "\U000F0141"
            text_font: mdi_32
            text_color: 0xFFFFFF
      on_press:
        - lambda: id(skip_selection) = 0;
        - lvgl.page.show: main_page

  - label:
      x: 200
      y: 15
      text: "\U000F04E2"
      text_font: mdi_32
      text_color: 0x00AE42

  - label:
