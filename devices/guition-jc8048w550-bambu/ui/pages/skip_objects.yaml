  # === SKIP BUTTON (bottom right) ===
  # Dos toques: el primero arma ("¿OMITIR N?"), el segundo omite. Omitir es irreversible.
  - button:
      id: btn_do_skip
      x: 530
      y: 420
      width: 250
      height: 50
      styles: style_btn_red
      hidden: true
      widgets:
        - label:
            id: lbl_do_skip
            align: CENTER
            text: "OMITIR"
            text_font: montserrat_22
      on_press:
        - if:
            condition:
              lambda: return !id(skip_armed);
            then:
              - lambda: id(skip_armed) = true;
              - lvgl.label.update:
                  id: lbl_do_skip
                  text: !lambda |-
                    static char buf[24];
                    snprintf(buf, sizeof(buf), "¿OMITIR %d?", __builtin_popcount(id(skip_selection)));
                    return buf;
            else:
              - homeassistant.action:
                  action: bambu_lab.skip_objects
                  data:
                    device_id: ${bambu_device_id}
                    objects: !lambda |-
                      std::string ids;
                      for (int i = 0; i < 16; i++) {
                        if ((id(skip_selection) & (1 << i)) && id(skip_obj_ids)[i] >= 0) {
                          if (!ids.empty()) ids += ",";
                          ids += to_string(id(skip_obj_ids)[i]);
                        }
                      }
                      return ids;
                  on_error:
                    - script.execute:
                        id: show_toast
                        msg: !lambda 'return std::string("Skip: ") + error;'
              - lambda: id(skip_selection) = 0;
              - script.execute: paint_skip_selection
              - lvgl.page.show: main_page
