# Filament Page - Carga/descarga de filamento (bobina externa, P1S sin AMS)
#
# Usa acciones NATIVAS de la integracion ha-bambulab via Home Assistant
# (no gcode crudo, no MQTT directo). Verificado contra HA real 2026-06-16:
# integracion v2.2.22 (fix de bobina externa #1849 presente).
#
# Flujo bobina externa:
#   - LOAD <material>: bambu_lab.load_filament (entity_id del tray externo + temperatura)
#                      -> la impresora calienta y pide insertar/empujar el filamento.
#   - DONE:            bambu_lab.done_load_filament (device_id) -> confirma fin de carga.
#   - RETRY:           bambu_lab.retry_load_filament (device_id) -> reintenta el avance.
#   - UNLOAD:          bambu_lab.unload_filament (device_id) -> descarga (un solo paso).
#   - EXTRUDE/RETRACT: bambu_lab.extrude_retract (device_id, type) -> ajuste manual.
#
# Substitutions: bambu_device_id (!secret), bambu_prefix.
# Tray bobina externa: sensor.${bambu_prefix}_externalspool_bobina_externa

id: filament_page
bg_color: 0x121212
widgets:
  # Header: volver a Motion
  - button:
      x: 100
      y: 10
      width: 80
      height: 50
      radius: 8
      bg_color: 0x2A2A2A
      widgets:
        - label:
            align: CENTER
            text: "\U000F0141"
            text_font: mdi_32
            text_color: 0xFFFFFF
      on_press:
        - lvgl.page.show: motion_page

  - label:
      x: 200
      y: 20
      text: "FILAMENT"
      text_font: montserrat_28
      text_color: 0x00AE42

  # Acceso al picker de inventario (qué bobina está cargada)
  - button:
      x: 600
      y: 10
      width: 190
      height: 50
      radius: 8
      bg_color: 0x2A2A2A
      widgets:
        - label:
            align: CENTER
            text: "SPOOLS"
            text_font: montserrat_22
            text_color: 0xFFFFFF
      on_press:
        - lvgl.page.show: filament_select_page
        - script.execute: render_filament_page

  # Fila 1: cargar por material (fija la temperatura de carga)
  - button:
      x: 100
      y: 75
      width: 215
      height: 110
      radius: 12
      bg_color: 0x00AE42
      widgets:
        - label:
            align: CENTER
            y: -18
            text: "\U000F0B30"
            text_font: mdi_48
            text_color: 0xFFFFFF
        - label:
            align: CENTER
            y: 35
            text: "LOAD PLA"
            text_font: montserrat_22
            text_color: 0xFFFFFF
      on_press:
        - homeassistant.action:
            action: bambu_lab.load_filament
            data:
              entity_id: sensor.${bambu_prefix}_externalspool_bobina_externa
              temperature: "220"

  - button:
      x: 330
      y: 75
      width: 215
      height: 110
      radius: 12
      bg_color: 0x00AE42
      widgets:
        - label:
            align: CENTER
            y: -18
            text: "\U000F0B30"
            text_font: mdi_48
            text_color: 0xFFFFFF
        - label:
            align: CENTER
            y: 35
            text: "LOAD PETG"
            text_font: montserrat_22
            text_color: 0xFFFFFF
      on_press:
        - homeassistant.action:
            action: bambu_lab.load_filament
            data:
              entity_id: sensor.${bambu_prefix}_externalspool_bobina_externa
              temperature: "250"

  - button:
      x: 560
      y: 75
      width: 215
      height: 110
      radius: 12
      bg_color: 0x00AE42
      widgets:
        - label:
            align: CENTER
            y: -18
            text: "\U000F0B30"
            text_font: mdi_48
            text_color: 0xFFFFFF
        - label:
            align: CENTER
            y: 35
            text: "LOAD TPU"
            text_font: montserrat_22
            text_color: 0xFFFFFF
      on_press:
        - homeassistant.action:
            action: bambu_lab.load_filament
            data:
              entity_id: sensor.${bambu_prefix}_externalspool_bobina_externa
              temperature: "235"

  # Fila 2: confirmar / reintentar la carga (bobina externa)
  - button:
      x: 100
      y: 195
      width: 335
      height: 90
      radius: 12
      bg_color: 0x1E88E5
      widgets:
        - label:
            align: CENTER
            text: "DONE"
            text_font: montserrat_28
            text_color: 0xFFFFFF
      on_press:
        - homeassistant.action:
            action: bambu_lab.done_load_filament
            data:
              device_id: ${bambu_device_id}

  - button:
      x: 455
      y: 195
      width: 335
      height: 90
      radius: 12
      bg_color: 0x2A2A2A
      widgets:
        - label:
            align: CENTER
            text: "RETRY"
            text_font: montserrat_28
            text_color: 0xFFFFFF
      on_press:
        - homeassistant.action:
            action: bambu_lab.retry_load_filament
            data:
              device_id: ${bambu_device_id}

  # Fila 3: descargar (un solo paso)
  - button:
      x: 100
      y: 295
      width: 690
      height: 90
      radius: 12
      bg_color: 0xCC3333
      widgets:
        - label:
            align: CENTER
            x: -75
            text: "\U000F0B2F"
            text_font: mdi_48
            text_color: 0xFFFFFF
        - label:
            align: CENTER
            x: 20
            text: "UNLOAD"
            text_font: montserrat_28
            text_color: 0xFFFFFF
      on_press:
        - homeassistant.action:
            action: bambu_lab.unload_filament
            data:
              device_id: ${bambu_device_id}

  # Fila 4: ajuste manual (extruir / retraer)
  - button:
      x: 100
      y: 395
      width: 335
      height: 55
      radius: 12
      bg_color: 0x2A2A2A
      widgets:
        - label:
            align: CENTER
            x: -60
            text: "\U000F0045"
            text_font: mdi_32
            text_color: 0x00AE42
        - label:
            align: CENTER
            x: 20
            text: "EXTRUDE"
            text_font: montserrat_22
            text_color: 0xFFFFFF
      on_press:
        - homeassistant.action:
            action: bambu_lab.extrude_retract
            data:
              device_id: ${bambu_device_id}
              type: Extrude

  - button:
      x: 455
      y: 395
      width: 335
      height: 55
      radius: 12
      bg_color: 0x2A2A2A
      widgets:
        - label:
            align: CENTER
            x: -60
            text: "\U000F004D"
            text_font: mdi_32
            text_color: 0xFF6B6B
        - label:
            align: CENTER
            x: 20
            text: "RETRACT"
            text_font: montserrat_22
            text_color: 0xFFFFFF
      on_press:
        - homeassistant.action:
            action: bambu_lab.extrude_retract
            data:
              device_id: ${bambu_device_id}
              type: Retract
