  # Paginación
  - button:
      x: 100
      y: 430
      width: 150
      height: 45
      radius: 10
      bg_color: 0x2A2A2A
      widgets:
        - label:
            align: CENTER
            text: "\U000F0141"
            text_font: mdi_32
            text_color: 0xFFFFFF
      on_press:
        - lambda: |-
            if (id(filament_page_idx) > 0) id(filament_page_idx)--;
        - script.execute: render_filament_page

  - label:
      id: lbl_spool_page
      x: 300
      y: 440
      width: 200
      text_align: CENTER
      text: "1/1"
      text_font: montserrat_22
      text_color: 0x888888

  - button:
      x: 640
      y: 430
      width: 150
      height: 45
      radius: 10
      bg_color: 0x2A2A2A
      widgets:
        - label:
            align: CENTER
            text: "\U000F0142"
            text_font: mdi_32
            text_color: 0xFFFFFF
      on_press:
        - lambda: |-
            std::string s = id(spoolman_inventory).state;
            int total = 0; size_t pos = 0;
            while (pos <= s.size()) {
              size_t pipe = s.find('|', pos);
              std::string e = (pipe == std::string::npos) ? s.substr(pos) : s.substr(pos, pipe - pos);
              if (!e.empty()) total++;
              if (pipe == std::string::npos) break;
              pos = pipe + 1;
            }
            if ((id(filament_page_idx) + 1) * 5 < total) id(filament_page_idx)++;
        - script.execute: render_filament_page
