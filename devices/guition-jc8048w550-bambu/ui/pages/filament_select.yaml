# Filament Select Page - Elegir qué bobina (Spool) está cargada
#
# Lista fija PAGINADA (patrón skip_objects): pool de 5 slots + prev/next.
# Datos: text_sensor spoolman_inventory = atributo `items` de sensor.spoolman_inventario
# ("id:name:grams|...", plantilla en HA que consulta la API de Spoolman). Ver
# docs/3c-fase2-ha-proxy en filament-lab.
#
# Al tocar un slot: input_text.set_value(input_text.filament_loaded_spool, <id>).
# Una automatización en HA escribe extra.active_tray=254 en ese Spool y limpia el
# anterior. La pantalla queda "tonta": solo fija un helper de HA.

id: filament_select_page
on_load:
  - script.execute:
      id: nav_highlight
      idx: 2
bg_color: 0x121212
widgets:
  # Volver a filament
  - button:
      x: 100
      y: 10
      width: 80
      height: 50
      radius: 8
      bg_color: 0x2A2A2A
      widgets:
        - label:
            align: CENTER
            text: "\U000F0141"
            text_font: mdi_32
            text_color: 0xFFFFFF
      on_press:
        - lvgl.page.show: filament_page

  - label:
      x: 200
      y: 20
      text: "SPOOLS"
      text_font: montserrat_28
      text_color: 0x00AE42

  # Pool fijo de 5 slots (rellenados en runtime por render_filament_page)
  - button:
      id: btn_spool_0
      x: 100
      y: 70
      width: 690
      height: 64
      radius: 12
      bg_color: 0x1E1E1E
      hidden: true
      widgets:
        - label:
            id: lbl_spool_0
            align: LEFT_MID
            x: 16
            text: ""
            text_font: montserrat_22
            text_color: 0xFFFFFF
      on_press:
        - if:
            condition:
              lambda: return id(spool_slot_ids)[0] >= 0;
            then:
              - homeassistant.action:
                  action: input_text.set_value
                  data:
                    entity_id: input_text.filament_loaded_spool
                    value: !lambda 'return to_string(id(spool_slot_ids)[0]);'

  - button:
      id: btn_spool_1
      x: 100
      y: 142
      width: 690
      height: 64
      radius: 12
      bg_color: 0x1E1E1E
      hidden: true
      widgets:
        - label:
            id: lbl_spool_1
            align: LEFT_MID
            x: 16
            text: ""
            text_font: montserrat_22
            text_color: 0xFFFFFF
      on_press:
        - if:
            condition:
              lambda: return id(spool_slot_ids)[1] >= 0;
            then:
              - homeassistant.action:
                  action: input_text.set_value
                  data:
                    entity_id: input_text.filament_loaded_spool
                    value: !lambda 'return to_string(id(spool_slot_ids)[1]);'

  - button:
      id: btn_spool_2
      x: 100
      y: 214
      width: 690
      height: 64
      radius: 12
      bg_color: 0x1E1E1E
      hidden: true
      widgets:
        - label:
            id: lbl_spool_2
            align: LEFT_MID
            x: 16
            text: ""
            text_font: montserrat_22
            text_color: 0xFFFFFF
      on_press:
        - if:
            condition:
              lambda: return id(spool_slot_ids)[2] >= 0;
            then:
              - homeassistant.action:
                  action: input_text.set_value
                  data:
                    entity_id: input_text.filament_loaded_spool
                    value: !lambda 'return to_string(id(spool_slot_ids)[2]);'

  - button:
      id: btn_spool_3
      x: 100
      y: 286
      width: 690
      height: 64
      radius: 12
      bg_color: 0x1E1E1E
      hidden: true
      widgets:
        - label:
            id: lbl_spool_3
            align: LEFT_MID
            x: 16
            text: ""
            text_font: montserrat_22
            text_color: 0xFFFFFF
      on_press:
        - if:
            condition:
              lambda: return id(spool_slot_ids)[3] >= 0;
            then:
              - homeassistant.action:
                  action: input_text.set_value
                  data:
                    entity_id: input_text.filament_loaded_spool
                    value: !lambda 'return to_string(id(spool_slot_ids)[3]);'

  - button:
      id: btn_spool_4
      x: 100
      y: 358
      width: 690
      height: 64
      radius: 12
      bg_color: 0x1E1E1E
      hidden: true
      widgets:
        - label:
            id: lbl_spool_4
            align: LEFT_MID
            x: 16
            text: ""
            text_font: montserrat_22
            text_color: 0xFFFFFF
      on_press:
        - if:
            condition:
              lambda: return id(spool_slot_ids)[4] >= 0;
            then:
              - homeassistant.action:
                  action: input_text.set_value
                  data:
                    entity_id: input_text.filament_loaded_spool
                    value: !lambda 'return to_string(id(spool_slot_ids)[4]);'

  # Paginación
  - button:
      x: 100
      y: 430
      width: 150
      height: 45
      radius: 10
      bg_color: 0x2A2A2A
      widgets:
        - label:
            align: CENTER
            text: "\U000F0141"
            text_font: mdi_32
            text_color: 0xFFFFFF
      on_press:
        - lambda: |-
            if (id(filament_page_idx) > 0) id(filament_page_idx)--;
        - script.execute: render_filament_page

  - label:
      id: lbl_spool_page
      x: 300
      y: 440
      width: 200
      text_align: CENTER
      text: "1/1"
      text_font: montserrat_22
      text_color: 0x888888

  - button:
      x: 640
      y: 430
      width: 150
      height: 45
      radius: 10
      bg_color: 0x2A2A2A
      widgets:
        - label:
            align: CENTER
            text: "\U000F0142"
            text_font: mdi_32
            text_color: 0xFFFFFF
      on_press:
        - lambda: if ((id(filament_page_idx) + 1) * 5 < id(spool_total)) id(filament_page_idx)++;
        - script.execute: render_filament_page
