# Controls Page - Temperaturas, luz y acceso a presets/fans
# Usa substitution: bambu_prefix

id: controls_page
bg_color: 0x121212
widgets:
  - label:
      x: 100
      y: 15
      text: "Controles"
      text_font: montserrat_28
      text_color: 0x00AE42

  # Card Nozzle
  - obj:
      x: 100
      y: 60
      width: 320
      height: 200
      styles: style_card
      scrollbar_mode: "off"
      scrollable: false
      widgets:
        - label:
            x: 10
            y: 5
            text: "\U000F18B8"
            text_font: mdi_48
            text_color: 0x00AE42

        - label:
            id: lbl_nozzle_ctrl
            x: 65
            y: 15
            text: "---°C / ---°C"
            text_font: montserrat_28
            text_color: 0xFFFFFF

        - button:
            x: 10
            y: 70
            width: 68
            height: 50
            styles: style_btn_dark
            widgets:
              - label:
                  align: CENTER
                  text: "-10"
                  text_font: montserrat_18
            on_press:
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                    value: !lambda "return std::max(0.0f, id(nozzle_target).state - 10);"

        - button:
            x: 83
            y: 70
            width: 68
            height: 50
            styles: style_btn_dark
            widgets:
              - label:
                  align: CENTER
                  text: "-5"
                  text_font: montserrat_18
            on_press:
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                    value: !lambda "return std::max(0.0f, id(nozzle_target).state - 5);"

        - button:
            x: 156
            y: 70
            width: 68
            height: 50
            styles: style_btn_dark
            widgets:
              - label:
                  align: CENTER
                  text: "+5"
                  text_font: montserrat_18
            on_press:
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                    value: !lambda "return std::min(300.0f, id(nozzle_target).state + 5);"

        - button:
            x: 229
            y: 70
            width: 68
            height: 50
            styles: style_btn_dark
            widgets:
              - label:
                  align: CENTER
                  text: "+10"
                  text_font: montserrat_18
            on_press:
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                    value: !lambda "return std::min(300.0f, id(nozzle_target).state + 10);"

        - button:
            x: 10
            y: 130
            width: 287
            height: 50
            styles: style_btn_red
            widgets:
              - label:
                  align: CENTER
                  text: "ENFRIAR"
                  text_font: montserrat_18
            on_press:
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.${bambu_prefix}_temperatura_objetivo_de_la_boquilla
                    value: "0"

