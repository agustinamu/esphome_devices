      x: 365
      y: 320
      width: 90
      height: 70
      radius: 10
      bg_color: 0x333333
      widgets:
        - label:
            align: CENTER
            text: "Y-1"
            text_font: montserrat_22
            text_color: 0xCCCCCC
      on_press:
