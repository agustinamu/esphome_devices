        - label:
            align: CENTER
            text: "X-1"
            text_font: montserrat_22
            text_color: 0xCCCCCC
      on_press:
        - homeassistant.action:
            action: bambu_lab.send_command
            data:
              device_id: ${bambu_device_id}
              command: "G91\nG0 X-1 F3000\nG90"

  # HOME XY (centro pequeño)
  - button:
      x: 355
      y: 230
      width: 110
      height: 80
      radius: 10
      bg_color: 0x00AE42
      widgets:
        - label:
            align: CENTER
            text: "\U000F0A12"
            text_font: mdi_32
            text_color: 0xFFFFFF
      on_press:
        - homeassistant.action:
            action: bambu_lab.send_command
            data:
              device_id: ${bambu_device_id}
              command: "G28 X Y"

  # Fila X derecha
