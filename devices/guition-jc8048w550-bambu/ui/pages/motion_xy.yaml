            align: CENTER
            text: "X-10"
            text_font: montserrat_22
            text_color: 0x00AE42
      on_press:
        - homeassistant.action:
            action: bambu_lab.send_command
            data:
              device_id: ${bambu_device_id}
              command: "G91\nG0 X-10 F3000\nG90"

  - button:
      x: 250
      y: 235
      width: 90
      height: 70
      radius: 10
      bg_color: 0x333333
