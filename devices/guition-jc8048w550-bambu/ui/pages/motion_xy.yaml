      y: 400
      width: 90
      height: 70
      radius: 10
      bg_color: 0x2A2A2A
      widgets:
        - label:
            align: CENTER
            text: "Y-10"
            text_font: montserrat_22
            text_color: 0x00AE42
      on_press:
        - homeassistant.action:
            action: bambu_lab.send_command
            data:
              device_id: ${bambu_device_id}
              command: "G91\nG0 Y-10 F3000\nG90"
