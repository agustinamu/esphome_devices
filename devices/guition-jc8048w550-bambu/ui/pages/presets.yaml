      radius: 12
      bg_color: 0x2A2A2A
      widgets:
        - label:
            align: CENTER
            text: "CANCELAR"
            text_font: montserrat_28
            text_color: 0xFFFFFF
      on_press:
        - lvgl.page.show: controls_page
