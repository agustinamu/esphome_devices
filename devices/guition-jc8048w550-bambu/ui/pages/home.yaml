# Home Page - Vista principal con estado de impresion
# Usa substitution: bambu_prefix

id: main_page
bg_color: 0x121212
widgets:
  # === HEADER ===
  - label:
      x: 100
      y: 10
      text: "BAMBU P1S"
      text_font: montserrat_22
      text_color: 0x00AE42

  - label:
      id: lbl_status
      x: 250
      y: 10
      text: "Idle"
      text_font: montserrat_22
      text_color: 0xFFFFFF

  - label:
      id: lbl_clock
      align: TOP_RIGHT
      x: -20
      y: 10
      text: "--:--"
      text_font: montserrat_22
      text_color: 0xFFFFFF

  # === CONTENIDO QUE SE OCULTA CUANDO IDLE ===
  # Contenedor para filename (se oculta cuando idle)
  - obj:
      id: home_filename_row
      x: 100
      y: 42
      width: 680
      height: 35
      bg_opa: 0%
      border_width: 0
      pad_all: 0
      widgets:
        - label:
            x: 0
            y: 0
            text: "\U000F0214"
            text_font: mdi_32
            text_color: 0x00AE42
        - label:
            id: lbl_filename
            x: 40
            y: 3
            width: 630
            text: "---"
            text_font: montserrat_22
            text_color: 0xFFFFFF
            long_mode: DOT

  # === TEMPERATURAS (siempre visibles) ===
  # Nozzle
  - label:
      id: icon_nozzle
      x: 120
      y: 85
      text: "\U000F18B8"
      text_font: mdi_48
      text_color: 0x00AE42

  - label:
      id: lbl_nozzle
      x: 180
      y: 90
      text: "---"
      text_font: montserrat_48
      text_color: 0xFFFFFF

  - label:
      id: lbl_nozzle_unit
      x: 280
      y: 105
      text: "°C"
      text_font: montserrat_22
      text_color: 0x888888

  # Bed
  - label:
      id: icon_bed
      x: 360
      y: 85
      text: "\U000F0157"
      text_font: mdi_48
      text_color: 0x00AE42

  - label:
      id: lbl_bed
      x: 420
      y: 90
      text: "---"
      text_font: montserrat_48
      text_color: 0xFFFFFF

  - label:
      id: lbl_bed_unit
      x: 520
      y: 105
      text: "°C"
      text_font: montserrat_22
      text_color: 0x888888

  # Skip objects button (visible solo imprimiendo con >1 objeto)
  - button:
      id: btn_skip_objects
      x: 600
      y: 85
      width: 160
      height: 55
      radius: 8
      bg_color: 0x2A2A2A
      border_width: 1
      border_color: 0x444444
      hidden: true
      widgets:
        - label:
            align: CENTER
            x: -20
            text: "\U000F04E2"
            text_font: mdi_32
            text_color: 0xFFAA00
        - label:
            align: CENTER
            x: 25
            text: "SKIP"
            text_font: montserrat_22
            text_color: 0xFFFFFF
      on_press:
        - lambda: id(skip_selection) = 0;
        - component.update: plate_image
        - lvgl.page.show: skip_objects_page

  # === VENTILADORES (se ocultan cuando idle) ===
  - obj:
      id: home_fans_row
      x: 100
      y: 150
      width: 580
      height: 45
      bg_opa: 0%
      border_width: 0
      pad_all: 0
      widgets:
        # Cooling Fan
        - label:
            x: 20
            y: 5
            text: "\U000F0210"
            text_font: mdi_32
            text_color: 0x00AE42
        - label:
            id: lbl_cooling_fan
            x: 58
            y: 8
            text: "--"
            text_font: montserrat_22
            text_color: 0xFFFFFF
        - label:
            x: 115
            y: 8
            text: "Cool"
            text_font: montserrat_18
            text_color: 0x666666

        # Aux Fan
        - label:
            x: 210
            y: 5
            text: "\U000F0210"
            text_font: mdi_32
            text_color: 0x888888
        - label:
            id: lbl_aux_fan
            x: 248
            y: 8
            text: "--"
            text_font: montserrat_22
            text_color: 0xFFFFFF
        - label:
            x: 305
            y: 8
            text: "Aux"
            text_font: montserrat_18
            text_color: 0x666666

        # Chamber Fan
        - label:
            x: 390
            y: 5
            text: "\U000F0210"
            text_font: mdi_32
            text_color: 0x888888
        - label:
            id: lbl_chamber_fan
            x: 428
            y: 8
            text: "--"
            text_font: montserrat_22
            text_color: 0xFFFFFF
        - label:
            x: 485
            y: 8
            text: "Cham"
            text_font: montserrat_18
            text_color: 0x666666

  # === BOTONES: Pause/Resume y Stop ===
  # PAUSE - visible cuando está imprimiendo
  - button:
      id: btn_pause
      x: 100
      y: 200
      width: 330
      height: 80
      styles: style_btn
      widgets:
        - label:
            align: CENTER
            x: -30
            text: "\U000F03E4"
            text_font: mdi_48
        - label:
            align: CENTER
            x: 40
            text: "PAUSE"
            text_font: montserrat_28
      on_press:
        - lvgl.page.show: confirm_pause_page

  # RESUME - visible cuando está pausado (oculto por defecto)
  - button:
      id: btn_resume
      x: 100
      y: 200
      width: 330
      height: 80
      hidden: true
      styles: style_btn
      widgets:
        - label:
            align: CENTER
            x: -40
            text: "\U000F040A"
            text_font: mdi_48
        - label:
            align: CENTER
            x: 45
            text: "RESUME"
            text_font: montserrat_28
      on_press:
        - homeassistant.action:
            action: button.press
            data:
              entity_id: button.${bambu_prefix}_continuar_la_impresion

  # STOP - visible cuando imprimiendo/pausado
  - button:
      id: btn_stop
      x: 450
      y: 200
      width: 320
      height: 80
      styles: style_btn_red
      widgets:
        - label:
            align: CENTER
            x: -30
            text: "\U000F04DB"
            text_font: mdi_48
        - label:
            align: CENTER
            x: 35
            text: "STOP"
            text_font: montserrat_28
      on_press:
        - lvgl.page.show: confirm_stop_page

  # LIGHT - visible cuando idle (reemplaza STOP)
  - button:
      id: btn_light_home
      x: 450
      y: 200
      width: 320
      height: 80
      hidden: true
      radius: 12
      bg_color: 0x1E1E1E
      widgets:
        - label:
            id: icon_light_home
            align: CENTER
            x: -30
            text: "\U000F0336"
            text_font: mdi_48
            text_color: 0x888888
        - label:
            id: lbl_light_home
            align: CENTER
            x: 35
            text: "LIGHT"
            text_font: montserrat_28
            text_color: 0x888888
      on_press:
        - homeassistant.action:
            action: light.toggle
            data:
              entity_id: light.${bambu_prefix}_luz_de_la_carcasa

  # === PROGRESO (se oculta cuando idle) ===
  - obj:
      id: home_progress_section
      x: 100
      y: 295
      width: 680
      height: 175
      bg_opa: 0%
      border_width: 0
      pad_all: 0
      widgets:
        # Barra de progreso slim (full width) + porcentaje
        - bar:
            id: progress_bar
            x: 0
            y: 2
            width: 590
            height: 14
            min_value: 0
            max_value: 100
            value: 0
            bg_color: 0x333333
            radius: 7
            indicator:
              bg_color: 0x00AE42
              radius: 7
        - label:
            id: lbl_progress
            x: 600
            y: -2
            width: 80
            text: "0%"
            text_font: montserrat_22
            text_color: 0xFFFFFF
            text_align: RIGHT

        # Fila 1: Capas (izq) | Tiempo restante (der)
        - label:
            x: 0
            y: 35
            text: "\U000F0E4B"
            text_font: mdi_32
            text_color: 0x00AE42
        - label:
            id: lbl_layers
            x: 40
            y: 38
            text: "-- / --"
            text_font: montserrat_28
            text_color: 0xFFFFFF

        - label:
            x: 380
            y: 35
            text: "\U000F0150"
            text_font: mdi_32
            text_color: 0x00AE42
        - label:
            id: lbl_remaining
            x: 420
            y: 38
            text: "--:--"
            text_font: montserrat_28
            text_color: 0xFFFFFF
        - label:
            x: 530
            y: 42
            text: "rest"
            text_font: montserrat_18
            text_color: 0x666666

        # Fila 2: Duracion total (izq) | Fin estimado (der, verde, grande)
        - label:
            x: 0
            y: 85
            text: "\U000F0150"
            text_font: mdi_32
            text_color: 0x888888
        - label:
            id: lbl_total_duration
            x: 40
            y: 88
            text: "--:--"
            text_font: montserrat_28
            text_color: 0xFFFFFF
        - label:
            x: 150
            y: 92
            text: "total"
            text_font: montserrat_18
            text_color: 0x666666

        - label:
            x: 380
            y: 92
            text: "Fin"
            text_font: montserrat_18
            text_color: 0x666666
        - label:
            id: lbl_finish_time
            x: 420
            y: 83
            text: "--:--"
            text_font: montserrat_36
            text_color: 0x00AE42
