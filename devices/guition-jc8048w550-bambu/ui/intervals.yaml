# Actualizaciones periodicas de datos
# Usa substitution: bambu_prefix

interval:
  - interval: 1s
    then:
      # Reloj
      - lvgl.label.update:
          id: lbl_clock
          text: !lambda |-
            static char buf[10];
            auto time = id(ha_time).now();
            snprintf(buf, sizeof(buf), "%02d:%02d", time.hour, time.minute);
            return buf;

      # Ocultar touch blocker despues de 500ms
      - if:
          condition:
            lambda: return id(touch_wake_time) > 0 && (millis() - id(touch_wake_time) > 500);
          then:
            - lambda: id(touch_wake_time) = 0;
            - lvgl.widget.update:
                id: touch_blocker
                hidden: true

      # Auto-dim despues de 60s (si no esta en modo "siempre encendida")
      - lambda: |-
          if (!id(screen_always_on) && !id(screen_dimmed) && (millis() - id(last_touch_time) > 60000)) {
            id(screen_dimmed) = true;
            id(backlight).turn_on().set_brightness(0.15).perform();
          }

      # Screensaver despues de 5 minutos (300s) - SOLO si no esta imprimiendo y no esta "siempre encendida"
      - if:
          condition:
            lambda: |-
              if (id(screen_always_on)) return false;
              if (id(screensaver_active)) return false;
              if (millis() - id(last_touch_time) < 300000) return false;
              return id(printer_is_idle);
          then:
            - lambda: id(screensaver_active) = true;
            - lvgl.page.show: screensaver_page
            - light.turn_on:
                id: backlight
                brightness: 5%

      # Actualizar reloj screensaver
      - lvgl.label.update:
          id: lbl_screensaver_clock
          text: !lambda |-
            static char buf[10];
            auto time = id(ha_time).now();
            snprintf(buf, sizeof(buf), "%02d:%02d", time.hour, time.minute);
            return buf;

  - interval: 2s
    then:
      # Evaluar estado idle una vez por ciclo (usado en múltiples widgets)
      # estado_actual usa estados en inglés: idle, offline, printing, paused_*, etc.
      - lambda: |-
          std::string status = id(printer_status).state;
          id(printer_is_idle) = (status == "idle" || status == "offline" || status.empty());

      # === HOME PAGE ===
      - lvgl.label.update:
          id: lbl_status
          text: !lambda |-
            if (id(printer_status).state.empty()) return "---";
            return id(printer_status).state.c_str();

      # Nombre del archivo
      - lvgl.label.update:
          id: lbl_filename
          text: !lambda |-
            if (id(current_file).state.empty()) return "Sin archivo";
            return id(current_file).state.c_str();

      # Hora estimada de fin
      - lvgl.label.update:
          id: lbl_finish_time
          text: !lambda |-
            static char buf[10];
            float hours_remaining = id(print_time_remaining).state;
            if (isnan(hours_remaining) || hours_remaining <= 0) return "--:--";
            auto now = id(ha_time).now();
            if (!now.is_valid()) return "--:--";
            int total_mins = now.hour * 60 + now.minute + (int)(hours_remaining * 60);
            int finish_hour = (total_mins / 60) % 24;
            int finish_min = total_mins % 60;
            snprintf(buf, sizeof(buf), "%02d:%02d", finish_hour, finish_min);
            return buf;

      # Mostrar Pause o Resume según estado
      - lvgl.widget.update:
          id: btn_pause
          hidden: !lambda |-
            if (id(printer_is_idle)) return true;
            // Ocultar si cualquier estado paused_*
            return id(printer_status).state.substr(0, 7) == "paused_";
      - lvgl.widget.update:
          id: btn_resume
          hidden: !lambda |-
            // Mostrar resume solo si cualquier estado paused_*
            return id(printer_status).state.substr(0, 7) != "paused_";

      # Mostrar STOP solo cuando imprimiendo o pausado
      - lvgl.widget.update:
          id: btn_stop
          hidden: !lambda return id(printer_is_idle);

      # Mostrar LIGHT cuando idle (reemplaza STOP)
      - lvgl.widget.update:
          id: btn_light_home
          hidden: !lambda return !id(printer_is_idle);

      # Actualizar estado visual del boton LIGHT
      - lvgl.label.update:
          id: icon_light_home
          text: !lambda |-
            if (id(chamber_light).state) return "\U000F0238";
            return "\U000F0336";
          text_color: !lambda |-
            if (id(chamber_light).state) return lv_color_hex(0x00AE42);
            return lv_color_hex(0x888888);
      - lvgl.label.update:
          id: lbl_light_home
          text_color: !lambda |-
            if (id(chamber_light).state) return lv_color_hex(0x00AE42);
            return lv_color_hex(0x888888);

      - lvgl.label.update:
          id: lbl_progress
          text: !lambda |-
            static char buf[8];
            snprintf(buf, sizeof(buf), "%.0f%%", id(print_progress).state);
            return buf;

      - lvgl.arc.update:
          id: progress_arc
          value: !lambda return (int)id(print_progress).state;

      - lvgl.label.update:
          id: lbl_remaining
          text: !lambda |-
            static char buf[16];
            float hours = id(print_time_remaining).state;
            if (isnan(hours)) return "--:--";
            int h = (int)hours;
            int m = (int)((hours - h) * 60);
            snprintf(buf, sizeof(buf), "%d:%02d", h, m);
            return buf;

      - lvgl.label.update:
          id: lbl_nozzle
          text: !lambda |-
            static char buf[16];
            if (!id(printer_online).state) return "---";
            snprintf(buf, sizeof(buf), "%.0f", id(nozzle_temp).state);
            return buf;
          text_color: !lambda |-
            if (id(printer_online).state) return lv_color_hex(0xFFFFFF);
            return lv_color_hex(0x555555);

      # Icono nozzle: naranja si calentando, verde si a temperatura
      - lvgl.label.update:
          id: icon_nozzle
          text_color: !lambda |-
            if (!id(printer_online).state) return lv_color_hex(0x555555);
            float current = id(nozzle_temp).state;
            float target = id(nozzle_target).state;
            if (target > 0 && current < target - 2) {
              // Calentando - naranja parpadeante
              return ((millis() / 500) % 2 == 0) ? lv_color_hex(0xFF8800) : lv_color_hex(0xFFAA00);
            }
            return lv_color_hex(0x00AE42);  // Normal - verde

      - lvgl.label.update:
          id: lbl_bed
          text: !lambda |-
            static char buf[16];
            if (!id(printer_online).state) return "---";
            snprintf(buf, sizeof(buf), "%.0f", id(bed_temp).state);
            return buf;
          text_color: !lambda |-
            if (id(printer_online).state) return lv_color_hex(0xFFFFFF);
            return lv_color_hex(0x555555);

      # Icono bed: naranja si calentando, verde si a temperatura
      - lvgl.label.update:
          id: icon_bed
          text_color: !lambda |-
            if (!id(printer_online).state) return lv_color_hex(0x555555);
            float current = id(bed_temp).state;
            float target = id(bed_target).state;
            if (target > 0 && current < target - 2) {
              // Calentando - naranja parpadeante
              return ((millis() / 500) % 2 == 0) ? lv_color_hex(0xFF8800) : lv_color_hex(0xFFAA00);
            }
            return lv_color_hex(0x00AE42);  // Normal - verde

      - lvgl.label.update:
          id: lbl_layers
          text: !lambda |-
            static char buf[16];
            snprintf(buf, sizeof(buf), "%.0f / %.0f", id(current_layer).state, id(total_layers).state);
            return buf;

      # Fans (Home page - compact)
      - lvgl.label.update:
          id: lbl_cooling_fan
          text: !lambda |-
            static char buf[8];
            float pct = id(cooling_fan_speed).state;
            if (!id(printer_online).state || isnan(pct)) return "--";
            snprintf(buf, sizeof(buf), "%.0f%%", pct);
            return buf;
          text_color: !lambda |-
            if (id(printer_online).state) return lv_color_hex(0xFFFFFF);
            return lv_color_hex(0x555555);

      - lvgl.label.update:
          id: lbl_aux_fan
          text: !lambda |-
            static char buf[8];
            float pct = id(aux_fan_speed).state;
            if (!id(printer_online).state || isnan(pct)) return "--";
            snprintf(buf, sizeof(buf), "%.0f%%", pct);
            return buf;
          text_color: !lambda |-
            if (id(printer_online).state) return lv_color_hex(0xFFFFFF);
            return lv_color_hex(0x555555);

      - lvgl.label.update:
          id: lbl_chamber_fan
          text: !lambda |-
            static char buf[8];
            float pct = id(chamber_fan_speed).state;
            if (!id(printer_online).state || isnan(pct)) return "--";
            snprintf(buf, sizeof(buf), "%.0f%%", pct);
            return buf;
          text_color: !lambda |-
            if (id(printer_online).state) return lv_color_hex(0xFFFFFF);
            return lv_color_hex(0x555555);

      # === CONTROLS PAGE ===
      - lvgl.label.update:
          id: lbl_nozzle_ctrl
          text: !lambda |-
            static char buf[24];
            snprintf(buf, sizeof(buf), "%.0f°C / %.0f°C", id(nozzle_temp).state, id(nozzle_target).state);
            return buf;

      - lvgl.label.update:
          id: lbl_bed_ctrl
          text: !lambda |-
            static char buf[24];
            snprintf(buf, sizeof(buf), "%.0f°C / %.0f°C", id(bed_temp).state, id(bed_target).state);
            return buf;

      # Light toggle feedback
      - lvgl.label.update:
          id: lbl_light_icon
          text: !lambda |-
            if (id(chamber_light).state) return "\U000F0238";
            return "\U000F0336";
          text_color: !lambda |-
            if (id(chamber_light).state) return lv_color_hex(0x00AE42);
            return lv_color_hex(0x888888);
      - lvgl.label.update:
          id: lbl_light_text
          text: !lambda |-
            if (id(chamber_light).state) return "ON";
            return "OFF";
          text_color: !lambda |-
            if (id(chamber_light).state) return lv_color_hex(0x00AE42);
            return lv_color_hex(0x888888);

      # === FANS PAGE ===
      # Cooling fan
      - lvgl.label.update:
          id: lbl_cooling_pct
          text: !lambda |-
            static char buf[8];
            float pct = id(cooling_fan_speed).state;
            if (isnan(pct)) return "0%";
            snprintf(buf, sizeof(buf), "%.0f%%", pct);
            return buf;
      - lvgl.label.update:
          id: lbl_cooling_val
          text: !lambda |-
            static char buf[8];
            float pct = id(cooling_fan_speed).state;
            if (isnan(pct)) return "0%";
            snprintf(buf, sizeof(buf), "%.0f%%", pct);
            return buf;
      - lvgl.arc.update:
          id: arc_cooling
          value: !lambda |-
            float pct = id(cooling_fan_speed).state;
            return isnan(pct) ? 0 : (int)pct;
      - lvgl.widget.update:
          id: sw_cooling
          state:
            checked: !lambda return id(cooling_fan_speed).state > 0;

      # Aux fan
      - lvgl.label.update:
          id: lbl_aux_pct
          text: !lambda |-
            static char buf[8];
            float pct = id(aux_fan_speed).state;
            if (isnan(pct)) return "0%";
            snprintf(buf, sizeof(buf), "%.0f%%", pct);
            return buf;
      - lvgl.label.update:
          id: lbl_aux_val
          text: !lambda |-
            static char buf[8];
            float pct = id(aux_fan_speed).state;
            if (isnan(pct)) return "0%";
            snprintf(buf, sizeof(buf), "%.0f%%", pct);
            return buf;
      - lvgl.arc.update:
          id: arc_aux
          value: !lambda |-
            float pct = id(aux_fan_speed).state;
            return isnan(pct) ? 0 : (int)pct;
      - lvgl.widget.update:
          id: sw_aux
          state:
            checked: !lambda return id(aux_fan_speed).state > 0;

      # Chamber fan
      - lvgl.label.update:
          id: lbl_chamber_pct
          text: !lambda |-
            static char buf[8];
            float pct = id(chamber_fan_speed).state;
            if (isnan(pct)) return "0%";
            snprintf(buf, sizeof(buf), "%.0f%%", pct);
            return buf;
      - lvgl.label.update:
          id: lbl_chamber_val
          text: !lambda |-
            static char buf[8];
            float pct = id(chamber_fan_speed).state;
            if (isnan(pct)) return "0%";
            snprintf(buf, sizeof(buf), "%.0f%%", pct);
            return buf;
      - lvgl.arc.update:
          id: arc_chamber
          value: !lambda |-
            float pct = id(chamber_fan_speed).state;
            return isnan(pct) ? 0 : (int)pct;
      - lvgl.widget.update:
          id: sw_chamber
          state:
            checked: !lambda return id(chamber_fan_speed).state > 0;

      # === INFO PAGE ===
      - lvgl.label.update:
          id: lbl_wifi_signal
          text: !lambda |-
            static char buf[16];
            snprintf(buf, sizeof(buf), "%.0f dBm", id(wifi_signal_db).state);
            return buf;

      - lvgl.label.update:
          id: lbl_ip
          text: !lambda return id(wifi_ip).state.c_str();

      - lvgl.label.update:
          id: lbl_uptime
          text: !lambda |-
            static char buf[32];
            float seconds = id(uptime_sensor).state;
            int days = (int)(seconds / 86400);
            int hours = (int)((seconds - days * 86400) / 3600);
            int mins = (int)((seconds - days * 86400 - hours * 3600) / 60);
            if (days > 0) {
              snprintf(buf, sizeof(buf), "%dd %dh %dm", days, hours, mins);
            } else {
              snprintf(buf, sizeof(buf), "%dh %dm", hours, mins);
            }
            return buf;

      # Online status dinamico
      - lvgl.label.update:
          id: lbl_online_status
          text: !lambda |-
            if (id(printer_online).state) return "Online";
            return "Offline";
          text_color: !lambda |-
            if (id(printer_online).state) return lv_color_hex(0x00AE42);
            return lv_color_hex(0xFF4444);
      - lvgl.label.update:
          id: lbl_online_icon
          text_color: !lambda |-
            if (id(printer_online).state) return lv_color_hex(0x00AE42);
            return lv_color_hex(0xFF4444);

      # Print error status
      - lvgl.label.update:
          id: lbl_print_error
          text: !lambda |-
            if (id(print_error).state) return "ERROR";
            return "OK";
          text_color: !lambda |-
            if (id(print_error).state) return lv_color_hex(0xFF4444);
            return lv_color_hex(0x00AE42);
      - lvgl.label.update:
          id: lbl_print_error_icon
          text_color: !lambda |-
            if (id(print_error).state) return lv_color_hex(0xFF4444);
            return lv_color_hex(0x00AE42);

      # HMS error status
      - lvgl.label.update:
          id: lbl_hms_status
          text: !lambda |-
            if (id(hms_error).state) {
              // Mostrar el texto del error HMS si existe
              if (!id(hms_errors).state.empty()) {
                return id(hms_errors).state.c_str();
              }
              return "ERROR";
            }
            return "OK";
          text_color: !lambda |-
            if (id(hms_error).state) return lv_color_hex(0xFF4444);
            return lv_color_hex(0x00AE42);
      - lvgl.label.update:
          id: lbl_hms_icon
          text_color: !lambda |-
            if (id(hms_error).state) return lv_color_hex(0xFF4444);
            return lv_color_hex(0x00AE42);

      # SD Card status
      - lvgl.label.update:
          id: lbl_sd_status
          text: !lambda |-
            if (id(sdcard_state).state.empty()) return "---";
            return id(sdcard_state).state.c_str();
          text_color: !lambda |-
            std::string state = id(sdcard_state).state;
            if (state == "normal" || state == "Normal") return lv_color_hex(0x00AE42);
            if (state.empty() || state == "unknown") return lv_color_hex(0x888888);
            return lv_color_hex(0xFFAA00);
      - lvgl.label.update:
          id: lbl_sd_icon
          text_color: !lambda |-
            std::string state = id(sdcard_state).state;
            if (state == "normal" || state == "Normal") return lv_color_hex(0x00AE42);
            if (state.empty() || state == "unknown") return lv_color_hex(0x888888);
            return lv_color_hex(0xFFAA00);

      # Sidebar: deshabilitar visualmente Controls y Motion cuando offline
      - lvgl.label.update:
          id: lbl_nav_controls
          text_color: !lambda |-
            if (id(printer_online).state) return lv_color_hex(0x666666);
            return lv_color_hex(0x333333);
      - lvgl.label.update:
          id: lbl_nav_motion
          text_color: !lambda |-
            if (id(printer_online).state) return lv_color_hex(0x666666);
            return lv_color_hex(0x333333);

      # Indicador de error en sidebar (parpadea alternando visibilidad)
      - lvgl.widget.update:
          id: lbl_error_indicator
          hidden: !lambda |-
            bool has_error = id(print_error).state || id(hms_error).state;
            if (!has_error) return true;
            // Parpadeo: alterna cada segundo basado en el tiempo
            return (millis() / 500) % 2 == 0;

      # === HOME: Ocultar secciones cuando idle/offline ===
      - lvgl.widget.update:
          id: home_filename_row
          hidden: !lambda return id(printer_is_idle);
      - lvgl.widget.update:
          id: home_fans_row
          hidden: !lambda return id(printer_is_idle);
      - lvgl.widget.update:
          id: home_progress_section
          hidden: !lambda return id(printer_is_idle);
