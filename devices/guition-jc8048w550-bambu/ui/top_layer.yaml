# Top Layer - Sidebar y Touch Blocker
# Siempre visible sobre todas las paginas

widgets:
  - obj:
      id: sidebar
      width: 80
      height: 480
      x: 0
      y: 0
      styles: style_sidebar
      pad_all: 0
      widgets:
        # Home
        - button:
            id: btn_nav_home
            x: 0
            y: 40
            styles: style_sidebar_btn_active
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F02DC"
                  text_font: mdi_32
            on_press:
              - lvgl.page.show: main_page
              - lvgl.widget.update:
                  id: btn_nav_home
                  text_color: 0x00AE42
                  bg_color: 0x1A1A1A
              - lvgl.widget.update:
                  id: btn_nav_controls
                  text_color: 0x666666
                  bg_color: 0x0D0D0D
              - lvgl.widget.update:
                  id: btn_nav_motion
                  text_color: 0x666666
                  bg_color: 0x0D0D0D
              - lvgl.widget.update:
                  id: btn_nav_info
                  text_color: 0x666666
                  bg_color: 0x0D0D0D

        # Controles
        - button:
            id: btn_nav_controls
            x: 0
            y: 140
            styles: style_sidebar_btn
            widgets:
              - label:
                  id: lbl_nav_controls
                  align: CENTER
                  text: "\U000F0493"
                  text_font: mdi_32
            on_press:
              - if:
                  condition:
                    binary_sensor.is_on: printer_online
                  then:
                    - lvgl.page.show: controls_page
                    - lvgl.widget.update:
                        id: btn_nav_home
                        text_color: 0x666666
                        bg_color: 0x0D0D0D
                    - lvgl.widget.update:
                        id: btn_nav_controls
                        text_color: 0x00AE42
                        bg_color: 0x1A1A1A
                    - lvgl.widget.update:
                        id: btn_nav_motion
                        text_color: 0x666666
                        bg_color: 0x0D0D0D
                    - lvgl.widget.update:
                        id: btn_nav_info
                        text_color: 0x666666
                        bg_color: 0x0D0D0D

        # Motion
        - button:
            id: btn_nav_motion
            x: 0
            y: 240
            styles: style_sidebar_btn
            widgets:
              - label:
                  id: lbl_nav_motion
                  align: CENTER
                  text: "\U000F0C90"
                  text_font: mdi_32
            on_press:
              - if:
                  condition:
                    binary_sensor.is_on: printer_online
                  then:
                    - lvgl.page.show: motion_page
                    - lvgl.widget.update:
                        id: btn_nav_home
                        text_color: 0x666666
                        bg_color: 0x0D0D0D
                    - lvgl.widget.update:
                        id: btn_nav_controls
                        text_color: 0x666666
                        bg_color: 0x0D0D0D
                    - lvgl.widget.update:
                        id: btn_nav_motion
                        text_color: 0x00AE42
                        bg_color: 0x1A1A1A
                    - lvgl.widget.update:
                        id: btn_nav_info
                        text_color: 0x666666
                        bg_color: 0x0D0D0D

        # Info
        - button:
            id: btn_nav_info
            x: 0
            y: 340
            styles: style_sidebar_btn
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F02FC"
                  text_font: mdi_32
            on_press:
              - lvgl.page.show: info_page
              - lvgl.widget.update:
                  id: btn_nav_home
                  text_color: 0x666666
                  bg_color: 0x0D0D0D
              - lvgl.widget.update:
                  id: btn_nav_controls
                  text_color: 0x666666
                  bg_color: 0x0D0D0D
              - lvgl.widget.update:
                  id: btn_nav_motion
                  text_color: 0x666666
                  bg_color: 0x0D0D0D
              - lvgl.widget.update:
                  id: btn_nav_info
                  text_color: 0x00AE42
                  bg_color: 0x1A1A1A

        # Error indicator (visible cuando hay error)
        - label:
            id: lbl_error_indicator
            x: 24
            y: 440
            text: "\U000F0026"
            text_font: mdi_32
            text_color: 0xFF4444
            hidden: true

  # Touch blocker overlay - captura toques por 500ms al despertar
  - button:
      id: touch_blocker
      x: 0
      y: 0
      width: 800
      height: 480
      bg_opa: 0%
      border_width: 0
      shadow_width: 0
      hidden: true
