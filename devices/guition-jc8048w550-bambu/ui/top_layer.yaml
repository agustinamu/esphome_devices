# Top Layer - Sidebar y Touch Blocker
# Siempre visible sobre todas las paginas

widgets:
  - obj:
      id: sidebar
      width: 80
      height: 480
      x: 0
      y: 0
      styles: style_sidebar
      pad_all: 0
      widgets:
        # Home
        - button:
            id: btn_nav_home
            x: 0
            y: 40
            styles: style_sidebar_btn_active
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F02DC"
                  text_font: mdi_32
            on_press:
              - lvgl.page.show: main_page

        # Controles
        - button:
            id: btn_nav_controls
            x: 0
            y: 140
            styles: style_sidebar_btn
            widgets:
              - label:
                  id: lbl_nav_controls
                  align: CENTER
                  text: "\U000F0493"
                  text_font: mdi_32
            on_press:
              - if:
                  condition:
                    binary_sensor.is_on: printer_online
                  then:
                    - lvgl.page.show: controls_page

        # Motion
        - button:
            id: btn_nav_motion
            x: 0
            y: 240
            styles: style_sidebar_btn
            widgets:
              - label:
                  id: lbl_nav_motion
                  align: CENTER
                  text: "\U000F0C90"
                  text_font: mdi_32
            on_press:
              - if:
                  condition:
                    lambda: return id(printer_is_idle);
                  then:
                    - if:
                        condition:
                          binary_sensor.is_on: printer_online
                        then:
                          - lvgl.page.show: motion_page
                  else:
                    - script.execute:
                        id: show_toast
                        msg: "No disponible mientras imprime"

        # Info
        - button:
            id: btn_nav_info
            x: 0
            y: 340
            styles: style_sidebar_btn
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F02FC"
                  text_font: mdi_32
            on_press:
              - lvgl.page.show: info_page

        # Error indicator (visible cuando hay error)
        - label:
            id: lbl_error_indicator
            x: 24
            y: 440
            text: "\U000F0026"
            text_font: mdi_32
            text_color: 0xFF4444
            hidden: true

  # Sin conexión con Home Assistant: los datos en pantalla pueden estar obsoletos.
  - label:
      id: lbl_no_ha
      align: TOP_MID
      x: 40
      y: 50
      text: "Sin conexión con Home Assistant"
      text_font: montserrat_18
      text_color: 0xFFFFFF
      bg_color: 0x8A1F1F
      bg_opa: 90%
      radius: 8
      pad_all: 8
      hidden: true

  # Aviso temporal (errores de acciones, bloqueos). Lo muestra el script show_toast.
  - label:
      id: lbl_toast
      align: BOTTOM_MID
      x: 40
      y: -16
      width: 640
      text: ""
      text_font: montserrat_18
      text_color: 0xFFFFFF
      text_align: CENTER
      long_mode: WRAP
      bg_color: 0x8A1F1F
      bg_opa: 90%
      radius: 10
      pad_all: 12
      hidden: true

  # Touch blocker overlay - captura toques por 500ms al despertar
  - button:
      id: touch_blocker
      x: 0
      y: 0
      width: 800
      height: 480
      bg_opa: 0%
      border_width: 0
      shadow_width: 0
      hidden: true
