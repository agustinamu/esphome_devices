# Guition JC8048W550 - Panel de control Bambu Lab P1S
# 800x480 - ESP32-S3 - Multi-página con menú lateral
# Requiere substitution: bambu_device_id

esphome:
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:

globals:
  - id: last_touch_time
    type: unsigned long
    initial_value: '0'
  - id: screen_dimmed
    type: bool
    initial_value: 'false'

time:
  - platform: homeassistant
    id: ha_time

# === Sensores de Home Assistant (Bambu Lab P1S) ===
sensor:
  - platform: homeassistant
    id: nozzle_temp
    entity_id: sensor.p1s_01p00c581002790_temperatura_de_la_boquilla

  - platform: homeassistant
    id: nozzle_target
    entity_id: sensor.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla

  - platform: homeassistant
    id: bed_temp
    entity_id: sensor.p1s_01p00c581002790_temperatura_de_la_cama

  - platform: homeassistant
    id: bed_target
    entity_id: sensor.p1s_01p00c581002790_temperatura_objetivo_de_la_cama

  - platform: homeassistant
    id: print_progress
    entity_id: sensor.p1s_01p00c581002790_progreso_de_la_impresion

  - platform: homeassistant
    id: print_time_remaining
    entity_id: sensor.p1s_01p00c581002790_tiempo_restante

  - platform: homeassistant
    id: current_layer
    entity_id: sensor.p1s_01p00c581002790_capa_actual

  - platform: homeassistant
    id: total_layers
    entity_id: sensor.p1s_01p00c581002790_cantidad_total_de_capas

  - platform: wifi_signal
    id: wifi_signal_db
    update_interval: 30s

  - platform: uptime
    id: uptime_sensor
    update_interval: 60s

text_sensor:
  - platform: homeassistant
    id: printer_status
    entity_id: sensor.p1s_01p00c581002790_estado_actual

  - platform: homeassistant
    id: current_file
    entity_id: sensor.p1s_01p00c581002790_nombre_de_la_tarea

  - platform: wifi_info
    ip_address:
      id: wifi_ip

# === Hardware ===

# Backlight
output:
  - platform: ledc
    pin: GPIO2
    frequency: 1220Hz
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

# I2C para touch
i2c:
  sda: GPIO19
  scl: GPIO20
  scan: false

touchscreen:
  - platform: gt911
    id: my_touch
    on_touch:
      - lambda: |-
          id(last_touch_time) = millis();
          if (id(screen_dimmed)) {
            id(screen_dimmed) = false;
            id(backlight).turn_on().set_brightness(1.0).perform();
          }

# Display
display:
  - platform: rpi_dpi_rgb
    id: my_display
    color_order: RGB
    invert_colors: false
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 480
    de_pin: GPIO40
    hsync_pin: GPIO39
    vsync_pin: GPIO41
    pclk_pin: GPIO42
    pclk_frequency: 16MHz
    pclk_inverted: false
    hsync_front_porch: 40
    hsync_pulse_width: 48
    hsync_back_porch: 40
    vsync_front_porch: 13
    vsync_pulse_width: 3
    vsync_back_porch: 32
    data_pins:
      red: [GPIO45, GPIO48, GPIO47, GPIO21, GPIO14]
      green: [GPIO5, GPIO6, GPIO7, GPIO15, GPIO16, GPIO4]
      blue: [GPIO8, GPIO3, GPIO46, GPIO9, GPIO10]

# === Fuentes ===
font:
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_32
    size: 32
    glyphs:
      - "\U000F02DC"  # home
      - "\U000F0493"  # tune-vertical
      - "\U000F0C90"  # crosshairs-gps (motion)
      - "\U000F02FC"  # information
      - "\U000F18B8"  # printer-3d-nozzle
      - "\U000F0157"  # bed (radiator)
      - "\U000F0238"  # lightbulb
      - "\U000F04DB"  # pause
      - "\U000F040A"  # play
      - "\U000F04D8"  # stop
      - "\U000F05A9"  # wifi
      - "\U000F0574"  # thermometer
      - "\U000F0E4B"  # layers
      - "\U000F0150"  # clock
      - "\U000F0415"  # refresh
      - "\U000F004D"  # arrow-up
      - "\U000F0045"  # arrow-down
      - "\U000F0041"  # arrow-left
      - "\U000F0040"  # arrow-right
      - "\U000F0A12"  # home-automation (for homing)

  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_48
    size: 48
    glyphs:
      - "\U000F004D"  # arrow-up
      - "\U000F0045"  # arrow-down
      - "\U000F0041"  # arrow-left
      - "\U000F0040"  # arrow-right
      - "\U000F0A12"  # home-automation

# === LVGL UI ===
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  color_depth: 16

  style_definitions:
    - id: style_sidebar
      bg_color: 0x1A1A1A
      radius: 0
      border_width: 0
      pad_all: 0

    - id: style_sidebar_btn
      bg_color: 0x1A1A1A
      text_color: 0x888888
      radius: 0
      border_width: 0
      width: 60
      height: 60

    - id: style_sidebar_btn_active
      bg_color: 0x1A1A1A
      text_color: 0x00AE42
      radius: 0
      border_width: 0

    - id: style_card
      bg_color: 0x1E1E1E
      radius: 12
      pad_all: 12
      border_width: 0

    - id: style_btn
      bg_color: 0x00AE42
      text_color: 0xFFFFFF
      radius: 8

    - id: style_btn_dark
      bg_color: 0x2A2A2A
      text_color: 0xFFFFFF
      radius: 8

    - id: style_btn_red
      bg_color: 0xE53935
      text_color: 0xFFFFFF
      radius: 8

    - id: style_motion_btn
      bg_color: 0x2A2A2A
      text_color: 0xFFFFFF
      radius: 30
      width: 60
      height: 60

  # === Menú lateral (siempre visible) ===
  top_layer:
    widgets:
      - obj:
          id: sidebar
          width: 60
          height: 480
          x: 0
          y: 0
          styles: style_sidebar
          widgets:
            # Home
            - button:
                id: btn_nav_home
                x: 0
                y: 20
                styles: style_sidebar_btn_active
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F02DC"
                      text_font: mdi_32
                on_press:
                  - lvgl.page.show: main_page
                  - lvgl.widget.update:
                      id: btn_nav_home
                      text_color: 0x00AE42
                  - lvgl.widget.update:
                      id: btn_nav_controls
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_motion
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_info
                      text_color: 0x888888

            # Controles
            - button:
                id: btn_nav_controls
                x: 0
                y: 100
                styles: style_sidebar_btn
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F0493"
                      text_font: mdi_32
                on_press:
                  - lvgl.page.show: controls_page
                  - lvgl.widget.update:
                      id: btn_nav_home
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_controls
                      text_color: 0x00AE42
                  - lvgl.widget.update:
                      id: btn_nav_motion
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_info
                      text_color: 0x888888

            # Motion
            - button:
                id: btn_nav_motion
                x: 0
                y: 180
                styles: style_sidebar_btn
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F0C90"
                      text_font: mdi_32
                on_press:
                  - lvgl.page.show: motion_page
                  - lvgl.widget.update:
                      id: btn_nav_home
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_controls
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_motion
                      text_color: 0x00AE42
                  - lvgl.widget.update:
                      id: btn_nav_info
                      text_color: 0x888888

            # Info
            - button:
                id: btn_nav_info
                x: 0
                y: 260
                styles: style_sidebar_btn
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F02FC"
                      text_font: mdi_32
                on_press:
                  - lvgl.page.show: info_page
                  - lvgl.widget.update:
                      id: btn_nav_home
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_controls
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_motion
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_info
                      text_color: 0x00AE42

  # === Páginas ===
  pages:
    # ========== PÁGINA HOME ==========
    - id: main_page
      bg_color: 0x121212
      widgets:
        # Header
        - label:
            x: 80
            y: 15
            text: "BAMBU LAB P1S"
            text_font: montserrat_28
            text_color: 0x00AE42

        - label:
            id: lbl_clock
            align: TOP_RIGHT
            x: -20
            y: 15
            text: "--:--"
            text_font: montserrat_22
            text_color: 0xFFFFFF

        # Card Estado y Progreso
        - obj:
            x: 80
            y: 55
            width: 420
            height: 200
            styles: style_card
            widgets:
              - label:
                  id: lbl_status
                  x: 10
                  y: 5
                  text: "Idle"
                  text_font: montserrat_28
                  text_color: 0x00AE42

              - label:
                  id: lbl_filename
                  x: 10
                  y: 40
                  text: "Sin tarea"
                  text_font: montserrat_18
                  text_color: 0xCCCCCC
                  long_mode: DOT
                  width: 380

              - label:
                  id: lbl_progress
                  align: CENTER
                  y: -10
                  text: "0%"
                  text_font: montserrat_48
                  text_color: 0xFFFFFF

              - bar:
                  id: progress_bar
                  align: CENTER
                  y: 40
                  width: 380
                  height: 16
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: 0x333333
                  radius: 8
                  indicator:
                    bg_color: 0x00AE42
                    radius: 8

              - label:
                  id: lbl_remaining
                  align: BOTTOM_MID
                  y: -10
                  text: "Restante: --"
                  text_font: montserrat_18
                  text_color: 0x888888

        # Card Temperaturas
        - obj:
            x: 520
            y: 55
            width: 260
            height: 200
            styles: style_card
            widgets:
              # Nozzle
              - label:
                  x: 10
                  y: 10
                  text: "\U000F18B8"
                  text_font: mdi_32
                  text_color: 0x00AE42

              - label:
                  id: lbl_nozzle
                  x: 55
                  y: 15
                  text: "---"
                  text_font: montserrat_28
                  text_color: 0xFFFFFF

              - label:
                  id: lbl_nozzle_target
                  x: 130
                  y: 20
                  text: "/ ---"
                  text_font: montserrat_18
                  text_color: 0x888888

              # Bed
              - label:
                  x: 10
                  y: 70
                  text: "\U000F0157"
                  text_font: mdi_32
                  text_color: 0x00AE42

              - label:
                  id: lbl_bed
                  x: 55
                  y: 75
                  text: "---"
                  text_font: montserrat_28
                  text_color: 0xFFFFFF

              - label:
                  id: lbl_bed_target
                  x: 130
                  y: 80
                  text: "/ ---"
                  text_font: montserrat_18
                  text_color: 0x888888

              # Capas
              - label:
                  x: 10
                  y: 130
                  text: "\U000F0E4B"
                  text_font: mdi_32
                  text_color: 0x00AE42

              - label:
                  id: lbl_layers
                  x: 55
                  y: 135
                  text: "-- / --"
                  text_font: montserrat_28
                  text_color: 0xFFFFFF

        # Botones de control
        - obj:
            x: 80
            y: 270
            width: 700
            height: 190
            scrollbar_mode: "off"
            styles: style_card
            widgets:
              # Primera fila
              - button:
                  x: 10
                  y: 10
                  width: 210
                  height: 70
                  styles: style_btn
                  widgets:
                    - label:
                        align: CENTER
                        text: "PAUSAR"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: button.press
                        data:
                          entity_id: button.p1s_01p00c581002790_pausar_la_impresion

              - button:
                  x: 235
                  y: 10
                  width: 210
                  height: 70
                  styles: style_btn
                  widgets:
                    - label:
                        align: CENTER
                        text: "REANUDAR"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: button.press
                        data:
                          entity_id: button.p1s_01p00c581002790_continuar_la_impresion

              - button:
                  x: 460
                  y: 10
                  width: 210
                  height: 70
                  styles: style_btn_red
                  widgets:
                    - label:
                        align: CENTER
                        text: "CANCELAR"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: button.press
                        data:
                          entity_id: button.p1s_01p00c581002790_detener_la_impresion

              # Segunda fila
              - button:
                  x: 10
                  y: 95
                  width: 210
                  height: 70
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: LEFT_MID
                        x: 20
                        text: "\U000F0238"
                        text_font: mdi_32
                    - label:
                        align: RIGHT_MID
                        x: -30
                        text: "LUZ"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: light.p1s_01p00c581002790_luz_de_la_carcasa

              - button:
                  x: 235
                  y: 95
                  width: 210
                  height: 70
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: LEFT_MID
                        x: 20
                        text: "\U000F0415"
                        text_font: mdi_32
                    - label:
                        align: RIGHT_MID
                        x: -20
                        text: "REFRESH"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: button.press
                        data:
                          entity_id: button.p1s_01p00c581002790_forzar_actualizacion_de_datos

    # ========== PÁGINA CONTROLES ==========
    - id: controls_page
      bg_color: 0x121212
      widgets:
        - label:
            x: 80
            y: 15
            text: "Controles"
            text_font: montserrat_28
            text_color: 0x00AE42

        # Card Nozzle
        - obj:
            x: 80
            y: 60
            width: 340
            height: 180
            styles: style_card
            widgets:
              - label:
                  x: 10
                  y: 10
                  text: "Nozzle"
                  text_font: montserrat_22
                  text_color: 0x00AE42

              - label:
                  id: lbl_nozzle_ctrl
                  align: CENTER
                  y: -10
                  text: "---°C / ---°C"
                  text_font: montserrat_36
                  text_color: 0xFFFFFF

              - button:
                  x: 20
                  y: 120
                  width: 70
                  height: 45
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-10"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return std::max(0.0f, id(nozzle_target).state - 10);"

              - button:
                  x: 100
                  y: 120
                  width: 60
                  height: 45
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-1"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return std::max(0.0f, id(nozzle_target).state - 1);"

              - button:
                  x: 170
                  y: 120
                  width: 60
                  height: 45
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+1"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return id(nozzle_target).state + 1;"

              - button:
                  x: 240
                  y: 120
                  width: 70
                  height: 45
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+10"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return id(nozzle_target).state + 10;"

        # Card Bed
        - obj:
            x: 440
            y: 60
            width: 340
            height: 180
            styles: style_card
            widgets:
              - label:
                  x: 10
                  y: 10
                  text: "Cama"
                  text_font: montserrat_22
                  text_color: 0x00AE42

              - label:
                  id: lbl_bed_ctrl
                  align: CENTER
                  y: -10
                  text: "---°C / ---°C"
                  text_font: montserrat_36
                  text_color: 0xFFFFFF

              - button:
                  x: 20
                  y: 120
                  width: 70
                  height: 45
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-10"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: !lambda "return std::max(0.0f, id(bed_target).state - 10);"

              - button:
                  x: 100
                  y: 120
                  width: 60
                  height: 45
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-1"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: !lambda "return std::max(0.0f, id(bed_target).state - 1);"

              - button:
                  x: 170
                  y: 120
                  width: 60
                  height: 45
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+1"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: !lambda "return id(bed_target).state + 1;"

              - button:
                  x: 240
                  y: 120
                  width: 70
                  height: 45
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+10"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: !lambda "return id(bed_target).state + 10;"

        # Card Presets y Luz
        - obj:
            x: 80
            y: 260
            width: 700
            height: 200
            styles: style_card
            widgets:
              - label:
                  x: 10
                  y: 10
                  text: "Preajustes"
                  text_font: montserrat_22
                  text_color: 0x00AE42

              - button:
                  x: 10
                  y: 50
                  width: 155
                  height: 60
                  styles: style_btn
                  widgets:
                    - label:
                        align: CENTER
                        text: "PLA"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: "220"
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: "60"

              - button:
                  x: 180
                  y: 50
                  width: 155
                  height: 60
                  styles: style_btn
                  widgets:
                    - label:
                        align: CENTER
                        text: "PETG"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: "250"
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: "80"

              - button:
                  x: 350
                  y: 50
                  width: 155
                  height: 60
                  styles: style_btn
                  widgets:
                    - label:
                        align: CENTER
                        text: "ABS"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: "260"
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: "100"

              - button:
                  x: 520
                  y: 50
                  width: 155
                  height: 60
                  styles: style_btn_red
                  widgets:
                    - label:
                        align: CENTER
                        text: "ENFRIAR"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
