# UI: Fuentes + LVGL + Actualizaciones
# Panel de control Bambu Lab P1S

# === Fuentes ===
font:
  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_32
    size: 32
    glyphs:
      - "\U000F02DC"  # home
      - "\U000F0493"  # tune-vertical
      - "\U000F0C90"  # crosshairs-gps (motion)
      - "\U000F02FC"  # information
      - "\U000F18B8"  # printer-3d-nozzle
      - "\U000F0157"  # bed (radiator)
      - "\U000F0238"  # lightbulb
      - "\U000F04DB"  # pause
      - "\U000F040A"  # play
      - "\U000F04D8"  # stop
      - "\U000F05A9"  # wifi
      - "\U000F0574"  # thermometer
      - "\U000F0E4B"  # layers
      - "\U000F0150"  # clock
      - "\U000F0415"  # refresh
      - "\U000F004D"  # arrow-up
      - "\U000F0045"  # arrow-down
      - "\U000F0041"  # arrow-left
      - "\U000F0040"  # arrow-right
      - "\U000F0A12"  # home-automation (for homing)
      - "\U000F0026"  # alert (warning triangle)
      - "\U000F0028"  # alert-circle
      - "\U000F05E0"  # checkbox-marked-circle (check ok)

  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_48
    size: 48
    glyphs:
      - "\U000F004D"  # arrow-up
      - "\U000F0045"  # arrow-down
      - "\U000F0041"  # arrow-left
      - "\U000F0040"  # arrow-right
      - "\U000F0A12"  # home-automation

# === LVGL UI ===
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  color_depth: 16

  style_definitions:
    - id: style_sidebar
      bg_color: 0x1A1A1A
      radius: 0
      border_width: 0
      pad_all: 0

    - id: style_sidebar_btn
      bg_color: 0x1A1A1A
      text_color: 0x888888
      radius: 0
      border_width: 0
      width: 60
      height: 60

    - id: style_sidebar_btn_active
      bg_color: 0x1A1A1A
      text_color: 0x00AE42
      radius: 0
      border_width: 0

    - id: style_card
      bg_color: 0x1E1E1E
      radius: 12
      pad_all: 12
      border_width: 0

    - id: style_btn
      bg_color: 0x00AE42
      text_color: 0xFFFFFF
      radius: 8

    - id: style_btn_dark
      bg_color: 0x2A2A2A
      text_color: 0xFFFFFF
      radius: 8

    - id: style_btn_red
      bg_color: 0xE53935
      text_color: 0xFFFFFF
      radius: 8

    - id: style_motion_btn
      bg_color: 0x2A2A2A
      text_color: 0xFFFFFF
      radius: 30
      width: 60
      height: 60

  # === Menu lateral (siempre visible) ===
  top_layer:
    widgets:
      - obj:
          id: sidebar
          width: 60
          height: 480
          x: 0
          y: 0
          styles: style_sidebar
          widgets:
            # Home
            - button:
                id: btn_nav_home
                x: 0
                y: 20
                styles: style_sidebar_btn_active
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F02DC"
                      text_font: mdi_32
                on_press:
                  - lvgl.page.show: main_page
                  - lvgl.widget.update:
                      id: btn_nav_home
                      text_color: 0x00AE42
                  - lvgl.widget.update:
                      id: btn_nav_controls
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_motion
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_info
                      text_color: 0x888888

            # Controles
            - button:
                id: btn_nav_controls
                x: 0
                y: 100
                styles: style_sidebar_btn
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F0493"
                      text_font: mdi_32
                on_press:
                  - lvgl.page.show: controls_page
                  - lvgl.widget.update:
                      id: btn_nav_home
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_controls
                      text_color: 0x00AE42
                  - lvgl.widget.update:
                      id: btn_nav_motion
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_info
                      text_color: 0x888888

            # Motion
            - button:
                id: btn_nav_motion
                x: 0
                y: 180
                styles: style_sidebar_btn
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F0C90"
                      text_font: mdi_32
                on_press:
                  - lvgl.page.show: motion_page
                  - lvgl.widget.update:
                      id: btn_nav_home
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_controls
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_motion
                      text_color: 0x00AE42
                  - lvgl.widget.update:
                      id: btn_nav_info
                      text_color: 0x888888

            # Info
            - button:
                id: btn_nav_info
                x: 0
                y: 260
                styles: style_sidebar_btn
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F02FC"
                      text_font: mdi_32
                on_press:
                  - lvgl.page.show: info_page
                  - lvgl.widget.update:
                      id: btn_nav_home
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_controls
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_motion
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_info
                      text_color: 0x00AE42

  # === Paginas ===
  pages:
    # ========== PAGINA HOME ==========
    - id: main_page
      bg_color: 0x121212
      widgets:
        # Header
        - label:
            x: 80
            y: 15
            text: "BAMBU LAB P1S"
            text_font: montserrat_28
            text_color: 0x00AE42

        - label:
            id: lbl_clock
            align: TOP_RIGHT
            x: -20
            y: 15
            text: "--:--"
            text_font: montserrat_22
            text_color: 0xFFFFFF

        # Card Estado y Progreso
        - obj:
            x: 80
            y: 55
            width: 420
            height: 200
            styles: style_card
            widgets:
              - label:
                  id: lbl_status
                  x: 10
                  y: 5
                  text: "Idle"
                  text_font: montserrat_28
                  text_color: 0x00AE42

              - label:
                  id: lbl_filename
                  x: 10
                  y: 40
                  text: "Sin tarea"
                  text_font: montserrat_18
                  text_color: 0xCCCCCC
                  long_mode: DOT
                  width: 380

              - label:
                  id: lbl_progress
                  align: CENTER
                  y: -10
                  text: "0%"
                  text_font: montserrat_48
                  text_color: 0xFFFFFF

              - bar:
                  id: progress_bar
                  align: CENTER
                  y: 40
                  width: 380
                  height: 16
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: 0x333333
                  radius: 8
                  indicator:
                    bg_color: 0x00AE42
                    radius: 8

              - label:
                  id: lbl_remaining
                  align: BOTTOM_MID
                  y: -10
                  text: "Restante: --"
                  text_font: montserrat_18
                  text_color: 0x888888

        # Card Temperaturas
        - obj:
            x: 520
            y: 55
            width: 260
            height: 200
            styles: style_card
            widgets:
              # Nozzle
              - label:
                  x: 10
                  y: 10
                  text: "\U000F18B8"
                  text_font: mdi_32
                  text_color: 0x00AE42

              - label:
                  id: lbl_nozzle
                  x: 55
                  y: 15
                  text: "---"
                  text_font: montserrat_28
                  text_color: 0xFFFFFF

              - label:
                  id: lbl_nozzle_target
                  x: 130
                  y: 20
                  text: "/ ---"
                  text_font: montserrat_18
                  text_color: 0x888888

              # Bed
              - label:
                  x: 10
                  y: 70
                  text: "\U000F0157"
                  text_font: mdi_32
                  text_color: 0x00AE42

              - label:
                  id: lbl_bed
                  x: 55
                  y: 75
                  text: "---"
                  text_font: montserrat_28
                  text_color: 0xFFFFFF

              - label:
                  id: lbl_bed_target
                  x: 130
                  y: 80
                  text: "/ ---"
                  text_font: montserrat_18
                  text_color: 0x888888

              # Capas
              - label:
                  x: 10
                  y: 130
                  text: "\U000F0E4B"
                  text_font: mdi_32
                  text_color: 0x00AE42

              - label:
                  id: lbl_layers
                  x: 55
                  y: 135
                  text: "-- / --"
                  text_font: montserrat_28
                  text_color: 0xFFFFFF

        # Botones de control
        - obj:
            x: 80
            y: 270
            width: 700
            height: 190
            scrollbar_mode: "off"
            styles: style_card
            widgets:
              # Primera fila
              - button:
                  x: 10
                  y: 10
                  width: 210
                  height: 70
                  styles: style_btn
                  widgets:
                    - label:
                        align: CENTER
                        text: "PAUSAR"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: button.press
                        data:
                          entity_id: button.p1s_01p00c581002790_pausar_la_impresion

              - button:
                  x: 235
                  y: 10
                  width: 210
                  height: 70
                  styles: style_btn
                  widgets:
                    - label:
                        align: CENTER
                        text: "REANUDAR"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: button.press
                        data:
                          entity_id: button.p1s_01p00c581002790_continuar_la_impresion

              - button:
                  x: 460
                  y: 10
                  width: 210
                  height: 70
                  styles: style_btn_red
                  widgets:
                    - label:
                        align: CENTER
                        text: "CANCELAR"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: button.press
                        data:
                          entity_id: button.p1s_01p00c581002790_detener_la_impresion

              # Segunda fila
              - button:
                  x: 10
                  y: 95
                  width: 210
                  height: 70
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: LEFT_MID
                        x: 20
                        text: "\U000F0238"
                        text_font: mdi_32
                    - label:
                        align: RIGHT_MID
                        x: -30
                        text: "LUZ"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: light.p1s_01p00c581002790_luz_de_la_carcasa

              - button:
                  x: 235
                  y: 95
                  width: 210
                  height: 70
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: LEFT_MID
                        x: 20
                        text: "\U000F0415"
                        text_font: mdi_32
                    - label:
                        align: RIGHT_MID
                        x: -20
                        text: "REFRESH"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: button.press
                        data:
                          entity_id: button.p1s_01p00c581002790_forzar_actualizacion_de_datos

    # ========== PAGINA CONTROLES ==========
    - id: controls_page
      bg_color: 0x121212
      widgets:
        - label:
            x: 80
            y: 15
            text: "Controles"
            text_font: montserrat_28
            text_color: 0x00AE42

        # Card Nozzle
        - obj:
            x: 80
            y: 60
            width: 340
            height: 180
            styles: style_card
            widgets:
              - label:
                  x: 10
                  y: 10
                  text: "Nozzle"
                  text_font: montserrat_22
                  text_color: 0x00AE42

              - label:
                  id: lbl_nozzle_ctrl
                  align: CENTER
                  y: -10
                  text: "---°C / ---°C"
                  text_font: montserrat_36
                  text_color: 0xFFFFFF

              - button:
                  x: 20
                  y: 120
                  width: 70
                  height: 45
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-10"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return std::max(0.0f, id(nozzle_target).state - 10);"

              - button:
                  x: 100
                  y: 120
                  width: 60
                  height: 45
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-1"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return std::max(0.0f, id(nozzle_target).state - 1);"

              - button:
                  x: 170
                  y: 120
                  width: 60
                  height: 45
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+1"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return id(nozzle_target).state + 1;"

              - button:
                  x: 240
                  y: 120
                  width: 70
                  height: 45
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+10"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return id(nozzle_target).state + 10;"

        # Card Bed
        - obj:
            x: 440
            y: 60
            width: 340
            height: 180
            styles: style_card
            widgets:
              - label:
                  x: 10
                  y: 10
                  text: "Cama"
                  text_font: montserrat_22
                  text_color: 0x00AE42

              - label:
                  id: lbl_bed_ctrl
                  align: CENTER
                  y: -10
                  text: "---°C / ---°C"
                  text_font: montserrat_36
                  text_color: 0xFFFFFF

              - button:
                  x: 20
                  y: 120
                  width: 70
                  height: 45
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-10"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: !lambda "return std::max(0.0f, id(bed_target).state - 10);"

              - button:
                  x: 100
                  y: 120
                  width: 60
                  height: 45
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-1"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: !lambda "return std::max(0.0f, id(bed_target).state - 1);"

              - button:
                  x: 170
                  y: 120
                  width: 60
                  height: 45
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+1"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: !lambda "return id(bed_target).state + 1;"

              - button:
                  x: 240
                  y: 120
                  width: 70
                  height: 45
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+10"
                        text_font: montserrat_18
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: !lambda "return id(bed_target).state + 10;"

        # Card Presets y Luz
        - obj:
            x: 80
            y: 260
            width: 700
            height: 200
            styles: style_card
            widgets:
              - label:
                  x: 10
                  y: 10
                  text: "Preajustes"
                  text_font: montserrat_22
                  text_color: 0x00AE42

              - button:
                  x: 10
                  y: 50
                  width: 155
                  height: 60
                  styles: style_btn
                  widgets:
                    - label:
                        align: CENTER
                        text: "PLA"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: "220"
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: "60"

              - button:
                  x: 180
                  y: 50
                  width: 155
                  height: 60
                  styles: style_btn
                  widgets:
                    - label:
                        align: CENTER
                        text: "PETG"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: "250"
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: "80"

              - button:
                  x: 350
                  y: 50
                  width: 155
                  height: 60
                  styles: style_btn
                  widgets:
                    - label:
                        align: CENTER
                        text: "ABS"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: "260"
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: "100"

              - button:
                  x: 520
                  y: 50
                  width: 155
                  height: 60
                  styles: style_btn_red
                  widgets:
                    - label:
                        align: CENTER
                        text: "ENFRIAR"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: "0"
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: "0"

              # Luz
              - label:
                  x: 10
                  y: 135
                  text: "\U000F0238"
                  text_font: mdi_32
                  text_color: 0x00AE42

              - label:
                  x: 55
                  y: 138
                  text: "Light"
                  text_font: montserrat_22
                  text_color: 0xFFFFFF

              - switch:
                  id: sw_light
                  x: 180
                  y: 130
                  width: 80
                  height: 40
                  on_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: light.p1s_01p00c581002790_luz_de_la_carcasa

    # ========== PAGINA MOTION ==========
    - id: motion_page
      bg_color: 0x121212
      widgets:
        - label:
            x: 80
            y: 8
            text: "Motion"
            text_font: montserrat_28
            text_color: 0x00AE42

        # Banner de warning
        - obj:
            x: 80
            y: 42
            width: 710
            height: 32
            bg_color: 0x332200
            radius: 6
            border_width: 1
            border_color: 0xFFA500
            scrollbar_mode: "off"
            widgets:
              - label:
                  align: LEFT_MID
                  x: 8
                  text: "\U000F0026"
                  text_font: mdi_32
                  text_color: 0xFFA500
              - label:
                  align: LEFT_MID
                  x: 42
                  text: "Pulsa HOME antes de mover"
                  text_font: montserrat_14
                  text_color: 0xFFCC66

        # === TOOL HEAD (XY) - D-Pad Style ===
        - obj:
            x: 80
            y: 82
            width: 340
            height: 380
            scrollbar_mode: "off"
            styles: style_card
            widgets:
              - label:
                  align: TOP_MID
                  y: 8
                  text: "TOOL HEAD"
                  text_font: montserrat_18
                  text_color: 0x00AE42

              # Y+ (arriba)
              - button:
                  x: 130
                  y: 45
                  width: 70
                  height: 55
                  radius: 8
                  bg_color: 0x2A2A2A
                  widgets:
                    - label:
                        align: CENTER
                        text: "+10"
                        text_font: montserrat_18
                        text_color: 0x00AE42
                  on_press:
                    - homeassistant.action:
                        action: bambu_lab.send_command
                        data:
                          device_id: ${bambu_device_id}
                          command: "G91\nG0 Y10 F3000\nG90"

              - button:
                  x: 130
                  y: 105
                  width: 70
                  height: 45
                  radius: 8
                  bg_color: 0x333333
                  widgets:
                    - label:
                        align: CENTER
                        text: "+1"
                        text_font: montserrat_14
                        text_color: 0xCCCCCC
                  on_press:
                    - homeassistant.action:
                        action: bambu_lab.send_command
                        data:
                          device_id: ${bambu_device_id}
                          command: "G91\nG0 Y1 F3000\nG90"

              # X- (izquierda)
              - button:
                  x: 15
                  y: 160
                  width: 55
                  height: 70
                  radius: 8
                  bg_color: 0x2A2A2A
                  widgets:
                    - label:
                        align: CENTER
                        text: "-10"
                        text_font: montserrat_18
                        text_color: 0x00AE42
                  on_press:
                    - homeassistant.action:
                        action: bambu_lab.send_command
                        data:
                          device_id: ${bambu_device_id}
                          command: "G91\nG0 X-10 F3000\nG90"

              - button:
                  x: 75
