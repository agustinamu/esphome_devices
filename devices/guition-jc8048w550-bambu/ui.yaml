# UI: Fuentes + LVGL + Actualizaciones
# Panel de control Bambu Lab P1S

# === Fuentes ===
# Montserrat custom sin anti-aliasing (bpp: 4) para mejor definicion
font:
  - file: "gfonts://Montserrat"
    id: montserrat_14
    size: 14
    bpp: 4

  - file: "gfonts://Montserrat"
    id: montserrat_18
    size: 18
    bpp: 4

  - file: "gfonts://Montserrat"
    id: montserrat_22
    size: 22
    bpp: 4

  - file: "gfonts://Montserrat"
    id: montserrat_28
    size: 28
    bpp: 4

  - file: "gfonts://Montserrat"
    id: montserrat_36
    size: 36
    bpp: 4

  - file: "gfonts://Montserrat"
    id: montserrat_48
    size: 48
    bpp: 4

  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_32
    size: 32
    bpp: 4
    glyphs:
      - "\U000F02DC"  # home
      - "\U000F0493"  # tune-vertical
      - "\U000F0C90"  # crosshairs-gps (motion)
      - "\U000F02FC"  # information
      - "\U000F18B8"  # printer-3d-nozzle
      - "\U000F0157"  # bed (radiator)
      - "\U000F0238"  # lightbulb
      - "\U000F04DB"  # pause
      - "\U000F040A"  # play
      - "\U000F04D8"  # stop
      - "\U000F05A9"  # wifi
      - "\U000F0574"  # thermometer
      - "\U000F0E4B"  # layers
      - "\U000F0150"  # clock
      - "\U000F0415"  # refresh
      - "\U000F004D"  # arrow-up
      - "\U000F0045"  # arrow-down
      - "\U000F0041"  # arrow-left
      - "\U000F0040"  # arrow-right
      - "\U000F0A12"  # home-automation (for homing)
      - "\U000F0026"  # alert (warning triangle)
      - "\U000F0028"  # alert-circle
      - "\U000F05E0"  # checkbox-marked-circle (check ok)
      - "\U000F0141"  # chevron-left (back)

  - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: mdi_48
    size: 48
    bpp: 4
    glyphs:
      - "\U000F004D"  # arrow-up
      - "\U000F0045"  # arrow-down
      - "\U000F0041"  # arrow-left
      - "\U000F0040"  # arrow-right
      - "\U000F0A12"  # home-automation
      - "\U000F18B8"  # printer-3d-nozzle
      - "\U000F0157"  # bed (radiator)
      - "\U000F04DB"  # pause
      - "\U000F040A"  # play
      - "\U000F04D8"  # stop
      - "\U000F0238"  # lightbulb
      - "\U000F0E4B"  # layers
      - "\U000F02DC"  # home
      - "\U000F0574"  # thermometer
      - "\U000F0C90"  # crosshairs-gps (tool head)
      - "\U000F0141"  # chevron-left (back)

# === LVGL UI ===
lvgl:
  displays:
    - my_display
  touchscreens:
    - my_touch
  color_depth: 16

  style_definitions:
    - id: style_sidebar
      bg_color: 0x1A1A1A
      radius: 0
      border_width: 0
      pad_all: 0

    - id: style_sidebar_btn
      bg_color: 0x1A1A1A
      text_color: 0x888888
      radius: 0
      border_width: 0
      width: 60
      height: 60

    - id: style_sidebar_btn_active
      bg_color: 0x1A1A1A
      text_color: 0x00AE42
      radius: 0
      border_width: 0

    - id: style_card
      bg_color: 0x1E1E1E
      radius: 12
      pad_all: 12
      border_width: 0

    - id: style_btn
      bg_color: 0x00AE42
      text_color: 0xFFFFFF
      radius: 8

    - id: style_btn_dark
      bg_color: 0x2A2A2A
      text_color: 0xFFFFFF
      radius: 8

    - id: style_btn_red
      bg_color: 0xE53935
      text_color: 0xFFFFFF
      radius: 8

    - id: style_motion_btn
      bg_color: 0x2A2A2A
      text_color: 0xFFFFFF
      radius: 30
      width: 60
      height: 60

  # === Menu lateral (siempre visible) ===
  top_layer:
    widgets:
      - obj:
          id: sidebar
          width: 60
          height: 480
          x: 0
          y: 0
          styles: style_sidebar
          widgets:
            # Home
            - button:
                id: btn_nav_home
                x: 0
                y: 20
                styles: style_sidebar_btn_active
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F02DC"
                      text_font: mdi_32
                on_press:
                  - lvgl.page.show: main_page
                  - lvgl.widget.update:
                      id: btn_nav_home
                      text_color: 0x00AE42
                  - lvgl.widget.update:
                      id: btn_nav_controls
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_motion
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_info
                      text_color: 0x888888

            # Controles
            - button:
                id: btn_nav_controls
                x: 0
                y: 100
                styles: style_sidebar_btn
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F0493"
                      text_font: mdi_32
                on_press:
                  - lvgl.page.show: controls_page
                  - lvgl.widget.update:
                      id: btn_nav_home
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_controls
                      text_color: 0x00AE42
                  - lvgl.widget.update:
                      id: btn_nav_motion
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_info
                      text_color: 0x888888

            # Motion
            - button:
                id: btn_nav_motion
                x: 0
                y: 180
                styles: style_sidebar_btn
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F0C90"
                      text_font: mdi_32
                on_press:
                  - lvgl.page.show: motion_page
                  - lvgl.widget.update:
                      id: btn_nav_home
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_controls
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_motion
                      text_color: 0x00AE42
                  - lvgl.widget.update:
                      id: btn_nav_info
                      text_color: 0x888888

            # Info
            - button:
                id: btn_nav_info
                x: 0
                y: 260
                styles: style_sidebar_btn
                widgets:
                  - label:
                      align: CENTER
                      text: "\U000F02FC"
                      text_font: mdi_32
                on_press:
                  - lvgl.page.show: info_page
                  - lvgl.widget.update:
                      id: btn_nav_home
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_controls
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_motion
                      text_color: 0x888888
                  - lvgl.widget.update:
                      id: btn_nav_info
                      text_color: 0x00AE42

  # === Paginas ===
  pages:
    # ========== PAGINA HOME ==========
    # Diseno minimalista - textos grandes, facil de leer
    - id: main_page
      bg_color: 0x121212
      widgets:
        # Header simple
        - label:
            x: 80
            y: 10
            text: "BAMBU P1S"
            text_font: montserrat_28
            text_color: 0x00AE42

        - label:
            id: lbl_clock
            align: TOP_RIGHT
            x: -20
            y: 10
            text: "--:--"
            text_font: montserrat_28
            text_color: 0xFFFFFF

        # Estado actual
        - label:
            id: lbl_status
            x: 80
            y: 50
            text: "Idle"
            text_font: montserrat_28
            text_color: 0x00AE42

        # Progreso GIGANTE - centro de atencion
        - label:
            id: lbl_progress
            align: TOP_MID
            x: 30
            y: 100
            text: "0%"
            text_font: montserrat_48
            text_color: 0xFFFFFF

        - bar:
            id: progress_bar
            x: 80
            y: 180
            width: 500
            height: 24
            min_value: 0
            max_value: 100
            value: 0
            bg_color: 0x333333
            radius: 12
            indicator:
              bg_color: 0x00AE42
              radius: 12

        # Tiempo restante grande
        - label:
            id: lbl_remaining
            x: 80
            y: 220
            text: "-- restante"
            text_font: montserrat_28
            text_color: 0x888888

        # Temperaturas - lado derecho, grandes
        - label:
            x: 600
            y: 100
            text: "\U000F18B8"
            text_font: mdi_48
            text_color: 0x00AE42

        - label:
            id: lbl_nozzle
            x: 660
            y: 105
            text: "---"
            text_font: montserrat_36
            text_color: 0xFFFFFF

        - label:
            x: 600
            y: 170
            text: "\U000F0157"
            text_font: mdi_48
            text_color: 0x00AE42

        - label:
            id: lbl_bed
            x: 660
            y: 175
            text: "---"
            text_font: montserrat_36
            text_color: 0xFFFFFF

        # Botones grandes - solo los esenciales
        - button:
            x: 80
            y: 280
            width: 220
            height: 90
            styles: style_btn
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F04DB"
                  text_font: mdi_48
            on_press:
              - homeassistant.action:
                  action: button.press
                  data:
                    entity_id: button.p1s_01p00c581002790_pausar_la_impresion

        - button:
            x: 320
            y: 280
            width: 220
            height: 90
            styles: style_btn
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F040A"
                  text_font: mdi_48
            on_press:
              - homeassistant.action:
                  action: button.press
                  data:
                    entity_id: button.p1s_01p00c581002790_continuar_la_impresion

        - button:
            x: 560
            y: 280
            width: 220
            height: 90
            styles: style_btn_red
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F04D8"
                  text_font: mdi_48
            on_press:
              - homeassistant.action:
                  action: button.press
                  data:
                    entity_id: button.p1s_01p00c581002790_detener_la_impresion

        # Segunda fila - Luz toggle grande
        - button:
            x: 80
            y: 385
            width: 220
            height: 80
            styles: style_btn_dark
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0238"
                  text_font: mdi_48
            on_press:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.p1s_01p00c581002790_luz_de_la_carcasa

        # Capas info
        - label:
            x: 320
            y: 400
            text: "\U000F0E4B"
            text_font: mdi_48
            text_color: 0x00AE42

        - label:
            id: lbl_layers
            x: 380
            y: 405
            text: "-- / --"
            text_font: montserrat_36
            text_color: 0xFFFFFF

    # ========== PAGINA CONTROLES ==========
    - id: controls_page
      bg_color: 0x121212
      widgets:
        - label:
            x: 80
            y: 15
            text: "Controles"
            text_font: montserrat_28
            text_color: 0x00AE42

        # Card Nozzle - con icono
        - obj:
            x: 80
            y: 60
            width: 340
            height: 220
            styles: style_card
            scrollbar_mode: "off"
            widgets:
              - label:
                  x: 10
                  y: 10
                  text: "\U000F18B8"
                  text_font: mdi_48
                  text_color: 0x00AE42

              - label:
                  id: lbl_nozzle_ctrl
                  x: 70
                  y: 20
                  text: "---°C / ---°C"
                  text_font: montserrat_36
                  text_color: 0xFFFFFF

              - button:
                  x: 10
                  y: 90
                  width: 75
                  height: 55
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-10"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return std::max(0.0f, id(nozzle_target).state - 10);"

              - button:
                  x: 90
                  y: 90
                  width: 70
                  height: 55
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-1"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return std::max(0.0f, id(nozzle_target).state - 1);"

              - button:
                  x: 165
                  y: 90
                  width: 70
                  height: 55
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+1"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return id(nozzle_target).state + 1;"

              - button:
                  x: 240
                  y: 90
                  width: 75
                  height: 55
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+10"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: !lambda "return id(nozzle_target).state + 10;"

              # Enfriar nozzle rapido
              - button:
                  x: 10
                  y: 155
                  width: 305
                  height: 50
                  styles: style_btn_red
                  widgets:
                    - label:
                        align: CENTER
                        text: "ENFRIAR"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                          value: "0"

        # Card Bed - con icono
        - obj:
            x: 440
            y: 60
            width: 340
            height: 220
            styles: style_card
            scrollbar_mode: "off"
            widgets:
              - label:
                  x: 10
                  y: 10
                  text: "\U000F0157"
                  text_font: mdi_48
                  text_color: 0x00AE42

              - label:
                  id: lbl_bed_ctrl
                  x: 70
                  y: 20
                  text: "---°C / ---°C"
                  text_font: montserrat_36
                  text_color: 0xFFFFFF

              - button:
                  x: 10
                  y: 90
                  width: 75
                  height: 55
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-10"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: !lambda "return std::max(0.0f, id(bed_target).state - 10);"

              - button:
                  x: 90
                  y: 90
                  width: 70
                  height: 55
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "-1"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: !lambda "return std::max(0.0f, id(bed_target).state - 1);"

              - button:
                  x: 165
                  y: 90
                  width: 70
                  height: 55
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+1"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: !lambda "return id(bed_target).state + 1;"

              - button:
                  x: 240
                  y: 90
                  width: 75
                  height: 55
                  styles: style_btn_dark
                  widgets:
                    - label:
                        align: CENTER
                        text: "+10"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: !lambda "return id(bed_target).state + 10;"

              # Enfriar bed rapido
              - button:
                  x: 10
                  y: 155
                  width: 305
                  height: 50
                  styles: style_btn_red
                  widgets:
                    - label:
                        align: CENTER
                        text: "ENFRIAR"
                        text_font: montserrat_22
                  on_press:
                    - homeassistant.action:
                        action: number.set_value
                        data:
                          entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                          value: "0"

        # Fila inferior: PRESETS y LIGHT
        - button:
            x: 80
            y: 300
            width: 340
            height: 160
            radius: 12
            bg_color: 0x1E1E1E
            widgets:
              - label:
                  align: CENTER
                  y: -20
                  text: "\U000F0493"
                  text_font: mdi_48
                  text_color: 0x00AE42
              - label:
                  align: CENTER
                  y: 40
                  text: "PRESETS"
                  text_font: montserrat_28
                  text_color: 0xFFFFFF
            on_press:
              - lvgl.page.show: controls_presets_page

        - button:
            x: 440
            y: 300
            width: 340
            height: 160
            radius: 12
            bg_color: 0x1E1E1E
            widgets:
              - label:
                  align: CENTER
                  y: -20
                  text: "\U000F0238"
                  text_font: mdi_48
                  text_color: 0x00AE42
              - label:
                  align: CENTER
                  y: 40
                  text: "LIGHT"
                  text_font: montserrat_28
                  text_color: 0xFFFFFF
            on_press:
              - homeassistant.action:
                  action: light.toggle
                  data:
                    entity_id: light.p1s_01p00c581002790_luz_de_la_carcasa

    # ========== SUBPAGINA PRESETS ==========
    - id: controls_presets_page
      bg_color: 0x121212
      widgets:
        # Header con boton volver
        - button:
            x: 80
            y: 10
            width: 80
            height: 50
            radius: 8
            bg_color: 0x2A2A2A
            widgets:
              - label:
                  align: CENTER
                  text: "\U000F0141"
                  text_font: mdi_32
                  text_color: 0xFFFFFF
            on_press:
              - lvgl.page.show: controls_page

        - label:
            x: 180
            y: 20
            text: "PRESETS"
            text_font: montserrat_28
            text_color: 0x00AE42

        # PLA
        - button:
            x: 80
            y: 80
            width: 340
            height: 120
            radius: 12
            bg_color: 0x00AE42
            widgets:
              - label:
                  align: CENTER
                  y: -15
                  text: "PLA"
                  text_font: montserrat_36
                  text_color: 0xFFFFFF
              - label:
                  align: CENTER
                  y: 30
                  text: "220 / 60"
                  text_font: montserrat_22
                  text_color: 0xFFFFFF
            on_press:
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                    value: "220"
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                    value: "60"
              - lvgl.page.show: controls_page

        # PETG
        - button:
            x: 440
            y: 80
            width: 340
            height: 120
            radius: 12
            bg_color: 0x00AE42
            widgets:
              - label:
                  align: CENTER
                  y: -15
                  text: "PETG"
                  text_font: montserrat_36
                  text_color: 0xFFFFFF
              - label:
                  align: CENTER
                  y: 30
                  text: "250 / 80"
                  text_font: montserrat_22
                  text_color: 0xFFFFFF
            on_press:
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                    value: "250"
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                    value: "80"
              - lvgl.page.show: controls_page

        # ABS
        - button:
            x: 80
            y: 220
            width: 340
            height: 120
            radius: 12
            bg_color: 0x00AE42
            widgets:
              - label:
                  align: CENTER
                  y: -15
                  text: "ABS"
                  text_font: montserrat_36
                  text_color: 0xFFFFFF
              - label:
                  align: CENTER
                  y: 30
                  text: "260 / 100"
                  text_font: montserrat_22
                  text_color: 0xFFFFFF
            on_press:
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                    value: "260"
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_cama
                    value: "100"
              - lvgl.page.show: controls_page

        # ENFRIAR TODO
        - button:
            x: 440
            y: 220
            width: 340
            height: 120
            radius: 12
            bg_color: 0xCC3333
            widgets:
              - label:
                  align: CENTER
                  y: -15
                  text: "ENFRIAR"
                  text_font: montserrat_36
                  text_color: 0xFFFFFF
              - label:
                  align: CENTER
                  y: 30
                  text: "0 / 0"
                  text_font: montserrat_22
                  text_color: 0xFFFFFF
            on_press:
              - homeassistant.action:
                  action: number.set_value
                  data:
                    entity_id: number.p1s_01p00c581002790_temperatura_objetivo_de_la_boquilla
                    value: "0"
              - homeassistant.action:
