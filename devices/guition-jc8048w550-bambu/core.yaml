# Hardware Bambu: Base + Auto-dim
# Extiende el paquete base con funcionalidad de auto-dim

packages:
  base: !include ../common/guition-jc8048w550-base.yaml


# Globals para auto-dim y screensaver
globals:
  - id: last_touch_time
    type: unsigned long
    initial_value: '0'
  - id: screen_dimmed
    type: bool
    initial_value: 'false'
  - id: screensaver_active
    type: bool
    initial_value: 'false'

# Botón de reinicio interno
button:
  - platform: restart
    id: restart_btn
    name: "Restart"
    internal: true

# Touch con callback para restaurar brillo y salir de screensaver
touchscreen:
  - platform: gt911
    id: my_touch
    on_touch:
      - lambda: |-
          id(last_touch_time) = millis();
          if (id(screen_dimmed)) {
            id(screen_dimmed) = false;
            id(backlight).turn_on().set_brightness(1.0).perform();
          }
      - if:
          condition:
            lambda: return id(screensaver_active);
          then:
            - lambda: id(screensaver_active) = false;
            - lvgl.page.show: main_page
