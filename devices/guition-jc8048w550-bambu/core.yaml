# Hardware Bambu: Base + Auto-dim
# Extiende el paquete base con funcionalidad de auto-dim

packages:
  base: !include ../common/guition-jc8048w550-base.yaml


# Globals para auto-dim y screensaver
globals:
  - id: last_touch_time
    type: unsigned long
    initial_value: '0'
  - id: screen_dimmed
    type: bool
    initial_value: 'false'
  - id: screensaver_active
    type: bool
    initial_value: 'false'
  - id: touch_wake_time
    type: unsigned long
    initial_value: '0'
  - id: screen_always_on
    type: bool
    initial_value: 'false'
  - id: printer_is_idle
    type: bool
    initial_value: 'true'
  # Skip objects
  - id: skip_selection
    type: int
    initial_value: '0'
  - id: skip_ids_str
    type: std::string

# HTTP para descargar imagen de placa (skip objects)
http_request:

online_image:
  - id: plate_image
    url: "${ha_url}/api/image_proxy/image.${bambu_prefix}_seleccionar_imagen"
    format: png
    type: RGB565
    resize: 200x200
    request_headers:
      Authorization: !secret ha_token
    on_download_finished:
      - lvgl.image.update:
          id: img_plate
          src: plate_image

# Botón de reinicio interno
button:
  - platform: restart
    id: restart_btn
    name: "Restart"
    internal: true

# Touch con callback para restaurar brillo y salir de screensaver
# El primer touch al despertar muestra overlay que bloquea 500ms
touchscreen:
  - platform: gt911
    id: my_touch
    on_touch:
      - lambda: id(last_touch_time) = millis();
      # Si estaba dimmed, restaurar brillo y mostrar blocker
      - if:
          condition:
            lambda: return id(screen_dimmed);
          then:
            - lambda: |-
                id(screen_dimmed) = false;
                id(touch_wake_time) = millis();
            - light.turn_on:
                id: backlight
                brightness: 100%
            - lvgl.widget.update:
                id: touch_blocker
                hidden: false
      # Si estaba en screensaver, volver a home y mostrar blocker
      - if:
          condition:
            lambda: return id(screensaver_active);
          then:
            - lambda: |-
                id(screensaver_active) = false;
                id(touch_wake_time) = millis();
            - lvgl.page.show: main_page
            - light.turn_on:
                id: backlight
                brightness: 100%
            - lvgl.widget.update:
                id: touch_blocker
                hidden: false
