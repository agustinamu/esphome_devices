# Hardware Bambu: Base + Auto-dim
# Extiende el paquete base con funcionalidad de auto-dim

packages:
  base: !include ../common/guition-jc8048w550-base.yaml

# Globals para auto-dim
globals:
  - id: last_touch_time
    type: unsigned long
    initial_value: '0'
  - id: screen_dimmed
    type: bool
    initial_value: 'false'

# Touch con callback para restaurar brillo
touchscreen:
  - platform: gt911
    id: my_touch
    on_touch:
      - lambda: |-
          id(last_touch_time) = millis();
          if (id(screen_dimmed)) {
            id(screen_dimmed) = false;
            id(backlight).turn_on().set_brightness(1.0).perform();
          }
