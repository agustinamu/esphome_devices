# Sensores de Home Assistant (Bambu Lab P1S)
# Entidades en espanol segun configuracion de HA
# Usa substitution: bambu_prefix

sensor:
  - platform: homeassistant
    id: nozzle_temp
    entity_id: sensor.${bambu_prefix}_temperatura_de_la_boquilla

  - platform: homeassistant
    id: nozzle_target
    entity_id: sensor.${bambu_prefix}_temperatura_objetivo_de_la_boquilla

  - platform: homeassistant
    id: bed_temp
    entity_id: sensor.${bambu_prefix}_temperatura_de_la_cama

  - platform: homeassistant
    id: bed_target
    entity_id: sensor.${bambu_prefix}_temperatura_objetivo_de_la_cama

  - platform: homeassistant
    id: print_progress
    entity_id: sensor.${bambu_prefix}_progreso_de_la_impresion

  - platform: homeassistant
    id: print_time_remaining
    entity_id: sensor.${bambu_prefix}_tiempo_restante

  - platform: homeassistant
    id: current_layer
    entity_id: sensor.${bambu_prefix}_capa_actual

  - platform: homeassistant
    id: total_layers
    entity_id: sensor.${bambu_prefix}_cantidad_total_de_capas

  # Ventiladores (porcentaje de velocidad)
  - platform: homeassistant
    id: aux_fan_speed
    entity_id: fan.${bambu_prefix}_ventilador_auxiliar
    attribute: percentage

  - platform: homeassistant
    id: cooling_fan_speed
    entity_id: fan.${bambu_prefix}_ventilador_de_enfriamiento
    attribute: percentage

  - platform: homeassistant
    id: chamber_fan_speed
    entity_id: fan.${bambu_prefix}_ventilador_de_la_carcasa
    attribute: percentage

  - platform: wifi_signal
    id: wifi_signal_db
    update_interval: 30s

  - platform: homeassistant
    id: printable_objects_count
    entity_id: sensor.${bambu_prefix}_objetos_imprimibles

  - platform: uptime
    id: uptime_sensor
    update_interval: 60s

text_sensor:
  - platform: homeassistant
    id: printer_status
    entity_id: sensor.${bambu_prefix}_estado_actual

  - platform: homeassistant
    id: current_file
    entity_id: sensor.${bambu_prefix}_nombre_de_la_tarea

  - platform: homeassistant
    id: hms_errors
    entity_id: sensor.${bambu_prefix}_errores_hms

  - platform: homeassistant
    id: sdcard_state
    entity_id: sensor.${bambu_prefix}_estado_de_la_tarjeta_sd

  # Skip objects (requiere template sensor en HA: sensor.p1s_printable_objects_list)
  - platform: homeassistant
    id: printable_objects_list
    entity_id: sensor.${bambu_prefix}_printable_objects_list

  # Bounding boxes serializados del plate_analyzer (ID:name:x1,y1,x2,y2|...)
  - platform: homeassistant
    id: plate_bbox_data
    entity_id: sensor.analizador_de_plato
    attribute: bbox_data

  - platform: wifi_info
    ip_address:
      id: wifi_ip

binary_sensor:
  - platform: homeassistant
    id: printer_online
    entity_id: binary_sensor.${bambu_prefix}_en_linea

  - platform: homeassistant
    id: chamber_light
    entity_id: light.${bambu_prefix}_luz_de_la_carcasa

  - platform: homeassistant
    id: print_error
    entity_id: binary_sensor.${bambu_prefix}_error_de_la_impresion

  - platform: homeassistant
    id: hms_error
    entity_id: binary_sensor.${bambu_prefix}_errores_hms
